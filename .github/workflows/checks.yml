name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Structural checks
        run: |
          for t in scripts/checks/test_*.py; do
            echo "== $t"
            python3 "$t"
          done
      - name: Example passes the package check
        run: |
          for d in examples/*/; do python3 scripts/checks/package_check.py "$d"; done
      - name: Build the plugin
        run: python3 scripts/build_plugin.py
