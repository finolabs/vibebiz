<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>vibebiz · Mục lục ý tưởng</title>
<!--
  vibebiz table of contents (research R4, data-model.md "Table of contents data").
  Fixed template: vibebiz rewrites only the JSON block with id "vibebiz-data";
  layout, styles and the renderer never change between runs.
  The JSON block is rebuilt from the frontmatter after every write and lists
  exactly the idea folders present. Escape every "<" in JSON strings as
  \u003c so the block cannot close the script tag early.
  Self-contained: no external scripts, fonts or images; works opened from disk.
-->
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #5f6368;
    --border: #e2e2de;
    --accent: #2f5bd3;
    --bar-track: #e8e8e4;
    --bar-fill: #2f8f5b;
    --warn-bg: #fff4d6;
    --warn-text: #7a5300;
    --ok-bg: #e3f4ea;
    --ok-text: #1e6b40;
    --bad-bg: #fde6e4;
    --bad-text: #9c2b20;
    --info-bg: #e7eefc;
    --info-text: #2343a0;
    --radius: 12px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1e1e21;
      --text: #ececee;
      --muted: #a2a2a8;
      --border: #333338;
      --accent: #8aa8ff;
      --bar-track: #2e2e33;
      --bar-fill: #4fbf82;
      --warn-bg: #3a2f12;
      --warn-text: #f3cf7a;
      --ok-bg: #173324;
      --ok-text: #8fdcb0;
      --bad-bg: #3d1c19;
      --bad-text: #f2a39a;
      --info-bg: #1c2747;
      --info-text: #a9c0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .notice {
    margin: 16px 0 0;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 0.9rem;
  }
  h2 { font-size: 1.15rem; margin: 32px 0 12px; }
  .list { display: grid; gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .card-id { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-title { font-size: 1.05rem; font-weight: 600; margin: 0; flex: 1 1 240px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    background: var(--info-bg);
    color: var(--info-text);
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-text); }
  .coverage { margin-top: 12px; }
  .coverage-label { font-size: 0.85rem; color: var(--muted); }
  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--bar-track);
    overflow: hidden;
    margin-top: 4px;
  }
  .bar > span { display: block; height: 100%; background: var(--bar-fill); }
  .next { margin: 12px 0 0; font-size: 0.95rem; }
  .next strong { font-weight: 600; }
  .outputs { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .outputs a { color: var(--accent); }
  .meta { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }
  .empty {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    color: var(--muted);
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 4px; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    background: var(--bar-track);
    padding: 1px 6px;
    border-radius: 6px;
  }
  footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); }
  @media (max-width: 480px) {
    main { padding: 16px 12px 32px; }
    header h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mục lục ý tưởng</h1>
    <p id="updated"></p>
    <p class="notice" id="ground-rules" hidden>Chưa đặt nguyên tắc chung cho không gian làm việc. Gõ <code>/vibebiz:constitution</code> để đặt.</p>
  </header>

  <section aria-labelledby="ideas-title">
    <h2 id="ideas-title">Ý tưởng của bạn</h2>
    <div class="list" id="ideas"></div>
  </section>

  <section aria-labelledby="examples-title">
    <h2 id="examples-title">Ví dụ</h2>
    <div class="list" id="examples"></div>
  </section>

  <footer>Trang này do vibebiz tự cập nhật sau mỗi lần làm việc. Mọi dữ liệu nằm trong thư mục của bạn.</footer>
</main>

<script type="application/json" id="vibebiz-data">
{
  "workspace": {
    "updated": "2026-11-12",
    "ground_rules_status": "deferred"
  },
  "ideas": [
    {
      "id": "001",
      "title": "Nhắc khách quay lại cửa hàng qua ứng dụng chat",
      "status": "clarifying",
      "estimate_status": "not-tech-reviewed",
      "coverage": { "clear": 5, "total": 15 },
      "next_step": "/vibebiz:continue",
      "outputs": [],
      "updated": "2026-11-12"
    }
  ],
  "examples": []
}
</script>

<script>
(function () {
  "use strict";

  var STATUS = {
    "clarifying": { label: "Đang làm rõ", tone: "" },
    "ready": { label: "Sẵn sàng đóng gói", tone: "ok" },
    "packaged": { label: "Đã đóng gói", tone: "" },
    "presented": { label: "Đã trình ban lãnh đạo", tone: "" },
    "approved": { label: "Được duyệt", tone: "ok" },
    "rejected": { label: "Không được duyệt", tone: "bad" },
    "needs-changes": { label: "Cần chỉnh sửa", tone: "warn" }
  };
  var ESTIMATE = {
    "not-tech-reviewed": { label: "Ước tính chưa qua đội kỹ thuật", tone: "warn" },
    "tech-reviewed": { label: "Ước tính đã qua đội kỹ thuật", tone: "ok" }
  };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  // Only relative workspace paths and https links are rendered as links.
  function safeHref(href) {
    if (typeof href !== "string" || href === "") return null;
    // Reject whitespace and control characters, which browsers strip before reading the scheme.
    if (/[\u0000-\u0020\u007f\\]/.test(href)) return null;
    if (/^https:\/\/[^\/]/i.test(href)) return href;
    // Otherwise only a relative workspace path: no scheme, not protocol-relative, not absolute.
    if (/^[A-Za-z0-9._-][A-Za-z0-9._\/-]*$/.test(href) && !/^[a-z][a-z0-9+.-]*:/i.test(href)) return href;
    return null;
  }

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "/" + m[2] + "/" + m[1] : (iso || "");
  }

  function badge(map, key) {
    var item = map[key] || { label: key || "Chưa rõ", tone: "" };
    return el("span", "badge" + (item.tone ? " " + item.tone : ""), item.label);
  }

  function renderCard(item, isExample) {
    var card = el("article", "card");
    var head = el("div", "card-head");
    if (item.id) head.appendChild(el("span", "card-id", item.id));
    head.appendChild(el("h3", "card-title", item.title || "Ý tưởng chưa có tên"));
    card.appendChild(head);

    var badges = el("div", "badges");
    if (isExample) badges.appendChild(el("span", "badge", "Ví dụ hư cấu"));
    if (item.status) badges.appendChild(badge(STATUS, item.status));
    if (item.estimate_status) badges.appendChild(badge(ESTIMATE, item.estimate_status));
    if (badges.childNodes.length) card.appendChild(badges);

    var cov = item.coverage;
    if (cov && typeof cov.total === "number" && cov.total > 0) {
      var clear = Math.max(0, Math.min(cov.clear || 0, cov.total));
      var pct = Math.round((clear / cov.total) * 100);
      var wrap = el("div", "coverage");
      wrap.appendChild(el("div", "coverage-label", "Đã rõ " + clear + "/" + cov.total + " hạng mục"));
      var bar = el("div", "bar");
      bar.setAttribute("role", "progressbar");
      bar.setAttribute("aria-valuemin", "0");
      bar.setAttribute("aria-valuemax", String(cov.total));
      bar.setAttribute("aria-valuenow", String(clear));
      var fill = el("span");
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      wrap.appendChild(bar);
      card.appendChild(wrap);
    }

    if (item.next_step) {
      var next = el("p", "next");
      next.appendChild(el("strong", null, "Bước tiếp theo: "));
      next.appendChild(el("code", null, item.next_step));
      card.appendChild(next);
    }

    var outputs = Array.isArray(item.outputs) ? item.outputs : [];
    if (outputs.length) {
      var ul = el("ul", "outputs");
      outputs.forEach(function (out) {
        var label = typeof out === "string" ? out : (out && (out.label || out.href));
        var href = safeHref(typeof out === "string" ? out : out && out.href);
        var li = el("li");
        if (href) {
          var a = el("a", null, label);
          a.href = href;
          if (/^https:/i.test(href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
          li.appendChild(a);
        } else {
          li.textContent = label || "";
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
    } else if (!isExample) {
      card.appendChild(el("div", "meta", "Chưa có tài liệu xuất."));
    }

    if (item.updated) card.appendChild(el("div", "meta", "Cập nhật " + formatDate(item.updated)));
    return card;
  }

  function renderEmpty(target, title, body) {
    var box = el("div", "empty");
    box.appendChild(el("strong", null, title));
    var p = el("span");
    body.forEach(function (part) {
      p.appendChild(part.code ? el("code", null, part.code) : document.createTextNode(part));
    });
    box.appendChild(p);
    target.appendChild(box);
  }

  var data = {};
  try {
    data = JSON.parse(document.getElementById("vibebiz-data").textContent) || {};
  } catch (e) {
    data = {};
    document.getElementById("updated").textContent = "Không đọc được dữ liệu mục lục. Gõ /vibebiz:status để vibebiz dựng lại.";
  }

  var ws = data.workspace || {};
  if (ws.updated) document.getElementById("updated").textContent = "Cập nhật lần cuối " + formatDate(ws.updated);
  if (ws.ground_rules_status === "deferred") document.getElementById("ground-rules").hidden = false;

  var ideas = Array.isArray(data.ideas) ? data.ideas : [];
  var ideasBox = document.getElementById("ideas");
  if (ideas.length) {
    ideas.forEach(function (idea) { ideasBox.appendChild(renderCard(idea, false)); });
  } else {
    renderEmpty(ideasBox, "Chưa có ý tưởng nào.", [
      "Gõ ", { code: "/vibebiz:new" }, " rồi kể cho vibebiz nghe vấn đề bạn đang muốn giải quyết."
    ]);
  }

  var examples = Array.isArray(data.examples) ? data.examples : [];
  var exBox = document.getElementById("examples");
  if (examples.length) {
    examples.forEach(function (ex) { exBox.appendChild(renderCard(ex, true)); });
  } else {
    renderEmpty(exBox, "Chưa có ví dụ trong thư mục này.", [
      "Muốn xem một ý tưởng mẫu đi hết quy trình? Gõ ", { code: "/vibebiz:help" }, "."
    ]);
  }
})();
</script>
</body>
</html>
