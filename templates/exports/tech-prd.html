<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>vibebiz · Tài liệu yêu cầu cho đội kỹ thuật</title>
<!--
  vibebiz tech requirements document. Fixed template: vibebiz writes only the
  JSON block with id "vibebiz-data" (the idea's exports/data.json, unchanged,
  the same data as the board deck); layout, styles and the renderer never
  change between runs.

  Layout: a document, read rather than presented, with a sticky section nav
  (a side column on wide screens, a scrolling strip on top of narrow ones).
  One section per tech.sections[] entry in a fixed order of section ids:
  business-context, user-stories, requirements, key-entities,
  success-criteria, assumptions (shown only when present), ai-fit,
  non-functional, glossary, open-questions. A required section missing from
  the data, or with no content, still shows with a "not yet clarified" tag.
  Sections whose id is not in the list follow at the end. Each section shows
  its heading, its content blocks (section.content is a blocks array, the same
  block types and chart components as the board deck; a plain string is shown
  as one paragraph; a list whose items all carry an id, such as FR-001, shows
  as a table; the slide infographics read as text here: a Gantt timeline, a
  journey and a gauge as tables, a KPI tree and control cards as lists, a
  callout and a deadline as a sentence, options as cards, compare forms as
  two columns, a donut as a plain meter), an optional diagram slot (section.diagram, a brief id in
  diagrams[]), the frameworks applied, one line of figure sources (source,
  period, measured or assumed) and the fields it is based on. After the
  sections: the full figures table, the items not yet clarified, and the link
  to the Spec Kit-compatible requirement file. Figures come only from
  numbers[] by id, written in text as {{N-01}}.

  Data shape beyond the export contract, and the brand tokens, are documented
  in board-deck.html and are the same here.

  Security: self-contained (no external scripts, fonts or images), strict CSP,
  data inserted only with textContent, createTextNode and setAttribute; links
  pass safeHref. Charts and icons are SVG built by the renderer with
  createElementNS and setAttribute. The single exception to text-only
  insertion is diagram SVG, sanitized as described at sanitizeSvg below.
  Escape every "<" in the JSON block as \u003c so the block cannot close the
  script tag early; SVG markup inside it is escaped the same way.
-->
<style>
  /* ---- Shared styles (identical in board-deck.html and tech-prd.html) ---- */

  /* Tokens. The brand group is the only part a brand profile changes. To apply
     a profile from the diagram-design plugin, copy its colors and font stacks
     into data.json "theme": { "light": {accent, accent_soft, ink, quiet,
     canvas, surface, rule, mark}, "dark": {same keys}, "fonts": {display,
     text} }. The renderer accepts only #hex colors and plain font names and
     sets them as --brand-<key>-light / --brand-<key>-dark / --brand-font-<key>
     on the page, which the defaults below read first. Status colors (gaps,
     estimates, errors) stay fixed so labels keep their meaning in any brand. */
  :root {
    /* Brand: colors (light) */
    --accent: var(--brand-accent-light, #0b6e66);
    --accent-soft: var(--brand-accent-soft-light, #dcefec);
    --ink: var(--brand-ink-light, #18202c);
    --quiet: var(--brand-quiet-light, #5a6474);
    --canvas: var(--brand-canvas-light, #e9ecf0);
    --surface: var(--brand-surface-light, #ffffff);
    --rule: var(--brand-rule-light, #d5dae1);
    --mark: var(--brand-mark-light, #aeb6c2);
    /* Brand: type */
    --font-display: var(--brand-font-display, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    --font-text: var(--brand-font-text, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    /* Status (fixed) */
    --gap-ink: #8a6416;
    --gap-line: #d6bd85;
    --est-ink: #5a6474;
    --est-line: #c3cad4;
    --bad-ink: #a3362a;
    --risk-ink: #9a4a08;
    --risk-soft: #fff4e5;
    --risk-line: #f1c9a0;
    /* Derived neutrals (fixed): card tint, secondary ink, text on the accent */
    --tint: #f3f5f7;
    --ink-2: #3d4654;
    --on-accent: #ffffff;
    /* Type scale, document (rem); slides override with frame-relative sizes */
    --fs-h1: 2rem;
    --fs-h2: 1.375rem;
    --fs-body: 1rem;
    --fs-small: 0.8125rem;
    --fs-badge: 0.72rem;
    --big: 2.25rem;
    /* Spacing */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 16px;
    --sp-4: 24px;
    --sp-5: 40px;
    --sp-6: 64px;
    --radius: 6px;
    --tl-mark: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: var(--brand-accent-dark, #4cc3b2);
      --accent-soft: var(--brand-accent-soft-dark, #143a36);
      --ink: var(--brand-ink-dark, #e7eaef);
      --quiet: var(--brand-quiet-dark, #98a2b2);
      --canvas: var(--brand-canvas-dark, #0c0f14);
      --surface: var(--brand-surface-dark, #151a21);
      --rule: var(--brand-rule-dark, #2a313c);
      --mark: var(--brand-mark-dark, #4a5363);
      --gap-ink: #d9b25c;
      --gap-line: #6e5a2c;
      --est-ink: #a9b2c0;
      --est-line: #3a4250;
      --bad-ink: #f0a093;
      --risk-ink: #f0b27a;
      --risk-soft: #2e2216;
      --risk-line: #7a4a1f;
      --tint: #1d232c;
      --ink-2: #c3cad4;
      --on-accent: #0c0f14;
    }
  }
  @media print {
    :root {
      --accent: var(--brand-accent-light, #0b6e66);
      --accent-soft: var(--brand-accent-soft-light, #dcefec);
      --ink: var(--brand-ink-light, #18202c);
      --quiet: var(--brand-quiet-light, #4a5262);
      --canvas: #ffffff;
      --surface: #ffffff;
      --rule: var(--brand-rule-light, #c9ced6);
      --mark: var(--brand-mark-light, #9aa3b0);
      --gap-ink: #6f500f;
      --gap-line: #c2a66a;
      --est-ink: #4a5262;
      --est-line: #aab2bd;
      --bad-ink: #8a2a20;
      --risk-ink: #8a3f05;
      --risk-soft: #fff4e5;
      --risk-line: #f1c9a0;
      --tint: #f3f5f7;
      --ink-2: #3d4654;
      --on-accent: #ffffff;
    }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    a { color: inherit; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: var(--fs-body);
    line-height: 1.5;
  }
  a { color: var(--accent); text-underline-offset: 0.15em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .missing { color: var(--bad-ink); font-style: italic; }
  .muted { color: var(--quiet); }

  /* Icons: inline SVG paths drawn by the renderer */
  .ico {
    width: 1.15em; height: 1.15em; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.2em;
  }

  /* Labels: present but quiet */
  .tag-gap {
    display: inline-flex; align-items: center; gap: 0.45em;
    padding: 0.1em 0.7em;
    border: 1px dashed var(--gap-line); border-radius: 999px;
    color: var(--gap-ink); font-size: var(--fs-small); font-weight: 500;
    line-height: 1.5;
  }
  .tag-gap::before {
    content: ""; width: 0.5em; height: 0.5em; flex: none;
    border: 1.5px solid currentColor; border-radius: 50%;
  }
  .badge-est {
    display: inline-block; vertical-align: middle;
    padding: 0 0.5em;
    border: 1px solid var(--est-line); border-radius: 4px;
    color: var(--est-ink); font-size: var(--fs-badge); font-weight: 500;
    letter-spacing: 0; line-height: 1.6; white-space: nowrap;
  }
  .num-value + .badge-est, .num-body > .badge-est { margin-top: 0.4em; }
  .fig-inline { font-weight: 650; font-variant-numeric: tabular-nums; }
  .fig-inline + .badge-est { margin-left: 0.35em; }
  .item-id { color: var(--quiet); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 0.4em; }

  /* Text blocks */
  .text { margin: 0; max-width: 62ch; }
  .list { margin: 0; padding-left: 1.2em; display: grid; gap: 0.35em; }
  .list-ico { list-style: none; padding-left: 0; gap: 0.7em; }
  .list-ico li { display: grid; grid-template-columns: auto 1fr; gap: 0.65em; align-items: start; }
  .list-ico .ico { color: var(--accent); width: 1.35em; height: 1.35em; margin-top: 0.05em; }

  /* Numbers */
  .nums { display: grid; gap: var(--sp-3); }
  .nums-row { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-5); }
  .num { display: grid; grid-template-columns: auto 1fr; gap: 0.6em; align-items: start; }
  .num-ico { color: var(--quiet); width: 1.3em; height: 1.3em; margin-top: 0.2em; }
  .num-body { grid-column: 2; display: grid; justify-items: start; }
  .num > .num-body:only-child { grid-column: 1 / -1; }
  .num-value {
    font-family: var(--font-display); font-weight: 700;
    font-size: calc(var(--big) * 0.5); line-height: 1.05;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .num-caption { color: var(--quiet); }
  .num-hero .num-value {
    font-size: var(--big); font-weight: 750; letter-spacing: -0.04em;
    line-height: 0.95; color: var(--accent);
  }
  .num-hero .num-value.is-long { font-size: calc(var(--big) * 0.6); letter-spacing: -0.03em; }
  .num-hero .num-caption { margin-top: 0.45em; font-size: 1.15em; color: var(--ink); }

  /* Charts */
  .chart, .compare-wrap, .timeline-wrap, .meter, .diagram { margin: 0; min-width: 0; }
  .chart-title { font-weight: 650; margin-bottom: 0.7em; }
  .cap { margin-top: 0.75em; font-size: var(--fs-small); color: var(--quiet); line-height: 1.4; }
  /* Bars: label column and track column; rows are placed by the renderer so
     a target line can span them. */
  .bars {
    position: relative; display: grid; grid-template-columns: minmax(4.5em, 16%) minmax(0, 1fr);
    gap: 0.7em 0.9em; align-items: center;
  }
  .bars.has-target { padding-top: 2.2em; }
  .bar-label { color: var(--quiet); }
  .bar-track { display: flex; align-items: center; gap: 0.6em; min-width: 0; }
  .bar-fill { display: block; flex: none; height: 1.6em; background: var(--mark); border-radius: 0 4px 4px 0; }
  .bar-row-above .bar-fill { background: #8fcfc6; background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
  .bar-row-hl .bar-fill { background: var(--accent); }
  .bar-row-below .bar-fill { background: var(--mark); }
  .bar-label.bar-row-hl { color: var(--ink); font-weight: 600; }
  .bar-value { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-value .badge-est { margin-left: 0.4em; }
  .bar-target { grid-column: 2; position: relative; align-self: stretch; pointer-events: none; }
  .bar-target-line { position: absolute; top: -2.2em; bottom: 0; border-left: 2px dashed var(--risk-ink); }
  .bar-target-label { position: absolute; top: 0; left: 0.5em; white-space: nowrap; color: var(--risk-ink); font-weight: 700; font-size: var(--fs-small); }
  .bar-target.is-missing .bar-target-line { border-left: 0; }
  .line-target { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 6; }
  .line-target-label { fill: var(--accent); font-weight: 700; }
  .line-path.is-ink { stroke: var(--ink); }
  .line-dot.is-ink { stroke: var(--ink); }
  .block-title { font-weight: 650; margin-bottom: 0.6em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .line-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .line-svg text { font-family: var(--font-text); }
  .line-base { stroke: var(--rule); stroke-width: 1; }
  .line-path { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .line-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
  .line-val { fill: var(--ink); font-weight: 650; }
  .line-x { fill: var(--quiet); }
  .chart-est { margin: 0.4em 0 0; }

  /* Before and after, now and later */
  .compare {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: var(--sp-4); align-items: start;
  }
  .side { border-top: 3px solid var(--rule); padding-top: 0.7em; display: grid; gap: 0.35em; align-content: start; justify-items: start; }
  .side.is-emph { border-top-color: var(--accent); }
  .side-label { color: var(--quiet); font-weight: 600; }
  .side.is-emph .side-label { color: var(--ink); }
  .side-value {
    font-family: var(--font-display); font-weight: 750;
    font-size: calc(var(--big) * 0.8); line-height: 1; letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums; color: var(--quiet);
  }
  .side.is-emph .side-value { color: var(--accent); }
  .side-caption { color: var(--quiet); }
  .side-list { list-style: none; margin: 0.2em 0 0; padding: 0; display: grid; gap: 0.45em; }
  .side-list li { display: grid; grid-template-columns: auto 1fr; gap: 0.55em; align-items: start; }
  .side-list .ico { color: var(--mark); margin-top: 0.1em; }
  .side.is-emph .side-list .ico { color: var(--accent); }
  .compare-arrow { align-self: center; color: var(--quiet); width: 1.8em; height: 1.8em; }

  /* Options compared */
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5em), 1fr)); gap: var(--sp-4); }
  .opt { border-top: 3px solid var(--rule); padding-top: 0.7em; display: grid; gap: 0.4em; align-content: start; }
  .opt.is-chosen { border-top-color: var(--accent); }
  .opt-name { font-weight: 700; font-size: 1.12em; line-height: 1.25; }
  .opt.is-chosen .opt-name { color: var(--accent); }
  .opt-chosen { display: inline-flex; align-items: center; gap: 0.3em; color: var(--accent); font-size: var(--fs-small); font-weight: 600; }
  .opt-summary { color: var(--quiet); }
  .opt-line { display: grid; grid-template-columns: auto 1fr; gap: 0.45em; align-items: start; }
  .opt-line .ico { margin-top: 0.15em; color: var(--quiet); }
  .opt-pro .ico { color: var(--accent); }

  /* Timeline */
  .tl {
    list-style: none; margin: 0; padding: 0; position: relative;
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--sp-4);
  }
  .tl::before {
    content: ""; position: absolute; left: 0; right: 0;
    top: calc(var(--tl-mark) / 2 - 1px); height: 2px; background: var(--rule);
  }
  .tl-item { position: relative; display: grid; gap: 0.3em; align-content: start; }
  .tl-mark { display: block; width: var(--tl-mark); height: var(--tl-mark); margin-bottom: 0.5em; }
  .tl-dot { fill: var(--surface); stroke: var(--mark); stroke-width: 3; }
  .tl-diamond { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .tl-when { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl-what { color: var(--quiet); }
  .tl-decision { display: grid; grid-template-columns: auto 1fr; gap: 0.4em; align-items: start; color: var(--accent); font-weight: 600; }
  .tl-decision .ico { margin-top: 0.1em; }

  /* Meter */
  .meter { display: grid; gap: 0.5em; }
  .meter-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3em 0.7em; }
  .meter-value { font-family: var(--font-display); font-weight: 750; font-size: calc(var(--big) * 0.55); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .meter-label { color: var(--quiet); }
  .meter-svg { display: block; width: 100%; height: 0.75em; }
  .meter-track { fill: var(--rule); }
  .meter-fill { fill: var(--accent); }

  /* Diagram */
  .diagram-svg svg { display: block; width: 100%; height: auto; }
  .diagram figcaption { margin-top: 0.6em; font-size: var(--fs-small); color: var(--quiet); }
  .no-diagram { display: flex; gap: 0.45em; align-items: center; margin: 0 0 0.6em; color: var(--quiet); font-size: var(--fs-small); }
  @media (prefers-color-scheme: dark) {
    /* Rendered diagrams carry their own light palette; give them paper. */
    .diagram-svg { background: #f4f6f8; border-radius: var(--radius); padding: 0.6em; }
  }
  @media print { .diagram-svg { background: none; padding: 0; } }

  /* Tables */
  .table-wrap { overflow-x: auto; min-width: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
  th, td { text-align: left; vertical-align: top; padding: 0.45em 0.65em 0.45em 0; border-bottom: 1px solid var(--rule); }
  th { color: var(--quiet); font-weight: 600; }
  td.num-cell { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.num-cell .badge-est { margin-left: 0.4em; }

  /* Stories, definitions, questions */
  .stories { display: grid; gap: var(--sp-4); }
  .story { border-left: 3px solid var(--rule); padding-left: var(--sp-3); }
  .story-title { font-size: 1.05rem; margin: 0 0 0.3em; display: flex; flex-wrap: wrap; gap: 0.5em; align-items: baseline; }
  .story-prio { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .story-why { margin: 0 0 0.5em; color: var(--quiet); }
  .scenarios { margin: 0; padding-left: 1.2em; display: grid; gap: 0.4em; }
  .scenarios strong { font-weight: 650; }
  .defs { margin: 0; display: grid; grid-template-columns: minmax(8em, 30%) 1fr; gap: 0.5em var(--sp-3); }
  .defs dt { font-weight: 650; }
  .defs dd { margin: 0; }
  .q-group { font-size: 1em; margin: var(--sp-3) 0 0.4em; }
  .q-group:first-child { margin-top: 0; }
  .q-group.blocking { color: var(--bad-ink); }
  .q-owner { color: var(--quiet); }

  /* Notices and links in the page header */
  .notice { margin: 0; font-size: var(--fs-small); color: var(--quiet); }
  .notice.bad { color: var(--bad-ink); font-weight: 600; }
  .notice.draft { color: var(--gap-ink); }
  .meta { margin: 0; font-size: var(--fs-small); color: var(--quiet); }
  .links-box { font-size: var(--fs-small); display: flex; flex-wrap: wrap; gap: 0.2em 1em; }
  .links-title { color: var(--quiet); }
  .links { display: contents; }
  .links li { list-style: none; }
  .gaps-list h3 { font-size: 1em; margin: 0 0 0.5em; }
  .gaps-list ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.4em; }
  .gaps-list li { display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center; }
  .frameworks, .based-on, .sources, .notes { margin: 0; }
  .line-label { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  /* ---- End of shared styles ---- */

  /* ---- Tech document ---- */
  body { background: var(--surface); }
  .doc-wrap {
    max-width: 1160px; margin: 0 auto;
    padding: clamp(16px, 4vw, 48px) clamp(14px, 3vw, 32px) var(--sp-6);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4);
  }
  .doc { min-width: 0; max-width: 46rem; }
  .doc-head { padding-bottom: var(--sp-4); border-bottom: 1px solid var(--rule); display: grid; gap: 0.45em; }
  .doc-head h1 {
    margin: 0; font-family: var(--font-display); font-size: var(--fs-h1);
    font-weight: 720; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance;
  }
  .doc-head .idea-title { margin: 0; font-size: 1.1rem; color: var(--quiet); }
  .doc-nav-title { margin: 0 0 0.5em; font-size: var(--fs-small); color: var(--quiet); font-weight: 600; }
  .doc-nav ol { list-style: none; margin: 0; padding: 0; }
  .doc-nav a {
    display: block; padding: 0.3em 0 0.3em 0.8em;
    border-left: 2px solid var(--rule);
    color: var(--quiet); text-decoration: none; font-size: 0.9rem; line-height: 1.35;
  }
  .doc-nav a:hover { color: var(--ink); }
  .doc-nav a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
  .doc-section { container: section / inline-size; padding-top: var(--sp-5); scroll-margin-top: 72px; }
  .doc-section > h2 {
    margin: 0 0 var(--sp-3); padding-bottom: 0.4em; border-bottom: 1px solid var(--rule);
    font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.01em;
  }
  .doc-section > * + * { margin-top: var(--sp-3); }
  .doc-section > h2 + * { margin-top: 0; }
  .section-gaps { display: flex; flex-wrap: wrap; gap: 0.4em; }
  .section-meta { display: grid; gap: 0.25em; font-size: var(--fs-small); color: var(--quiet); padding-top: var(--sp-2); border-top: 1px dashed var(--rule); }
  .doc .chart, .doc .compare-wrap, .doc .timeline-wrap, .doc .meter { max-width: 36rem; }
  .doc .nums-row { --big: 2.75rem; }
  .doc .figures-table td, .doc .figures-table th { font-size: 0.9rem; }
  .snapshot { margin: 0; }

  // ---- Inline SVG ----
  // Inline SVG is the one exception to text-only insertion. It is taken only
  // from the dedicated field diagrams[].svg, parsed with DOMParser as
  // image/svg+xml (never as HTML), and before insertion loses: <script>,
  // <foreignObject>, animation elements (they can rewrite attributes later),
  // embedding elements, any element outside the SVG namespace, every event
  // handler attribute (on*), and every href / xlink:href / src that does not
  // point inside the same SVG ("#id"). Markup that fails to parse, or whose
  // root is not <svg>, is dropped and the "no diagram" table shows instead.
  // The Content Security Policy above blocks any load regardless.
  var SVG_DROP = {
    script: 1, foreignobject: 1, animate: 1, animatemotion: 1, animatetransform: 1,
    set: 1, discard: 1, handler: 1, listener: 1, iframe: 1, embed: 1, object: 1,
    audio: 1, video: 1

  function sanitizeSvg(markup) {
    if (typeof markup !== "string" || markup === "" || typeof DOMParser === "undefined") return null;
    var doc;
    try { doc = new DOMParser().parseFromString(markup, "image/svg+xml"); } catch (e) { return null; }
    var root = doc && doc.documentElement;
    if (!root || root.namespaceURI !== SVG_NS || String(root.localName).toLowerCase() !== "svg") return null;
    if (doc.getElementsByTagName("parsererror").length) return null;
    var nodes = [root].concat(Array.prototype.slice.call(root.getElementsByTagName("*")));
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var name = String(node.localName).toLowerCase();

        if (node.parentNode) node.parentNode.removeChild(node);
        continue;

        var attr = node.attributes[j];
        var local = String(attr.localName).toLowerCase();
        var value = String(attr.value).replace(/[\u0000- ]+/g, "");
        var drop = local.indexOf("on") === 0 ||
          ((local === "href" || local === "src") && !/^#[A-Za-z0-9_.:-]*$/.test(value)) ||
          /javascript:|vbscript:/i.test(value);
        if (drop) node.removeAttributeNode(attr);

    return document.importNode(root, true);

  // target: { ref, label } on a chart: a reference line (a goal, a cost).

  function lineChart(b, ctx) {
    var fig = el("figure", "chart");
    addNote(fig, blockTitle(b));
    var items = figItems(b);
    var tg = targetOf(b, ctx);
    var tv = tg && isNum(tg.f) ? tg.f.value : null;
    var pts = [];
    var figs = [];
    var missing = [];
    items.forEach(function (it) {
      var f = useFig(ctx, str(it.ref));
      figs.push(f);
      if (isNum(f)) pts.push({ f: f, label: str(it.caption || it.ref) });
      else missing.push(str(it.ref));
    });
    var W = 480, H = 220, PADX = 30, TOP = 34, BOTTOM = 34;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, "class": "line-svg", role: "img" });
    svg.setAttribute("aria-label", (b.title ? str(b.title) + ": " : "") + pts.map(function (p) { return p.label + " " + formatValue(p.f); }).join(", ") + (tg ? "; " + targetText(tg) : ""));
    var ink = tg ? " is-ink" : "";
    if (pts.length) {
      var vals = pts.map(function (p) { return p.f.value; });
      if (tv !== null) vals.push(tv);
      var lo = Math.min.apply(null, vals);
      var hi = Math.max.apply(null, vals);

      var pad = (hi - lo) * 0.3;
      lo -= pad; hi += pad;
      var x = function (i) { return pts.length === 1 ? W / 2 : PADX + i * (W - 2 * PADX) / (pts.length - 1); };
      var y = function (v) { return TOP + (1 - (v - lo) / (hi - lo)) * (H - TOP - BOTTOM); };

      if (tv !== null) {
        svg.appendChild(svgEl("line", { x1: 0, x2: W, y1: y(tv).toFixed(1), y2: y(tv).toFixed(1), "class": "line-target" }));
        var tl = svgEl("text", { x: W, y: (y(tv) - 8).toFixed(1), "text-anchor": "end", "font-size": 14, "class": "line-target-label" });

        val.textContent = formatValue(p.f);
        svg.appendChild(val);
        var lab = svgEl("text", { x: x(i).toFixed(1), y: H - 6, "text-anchor": "middle", "font-size": 13, "class": "line-x" });
        lab.textContent = p.label;
        svg.appendChild(lab);
      });
    }
    fig.appendChild(svg);
    if (pts.some(function (p) { return isEstimate(p.f); }) || (tg && isEstimate(tg.f))) {
      var est = el("p", "chart-est");
      est.appendChild(estimateBadge());
      fig.appendChild(est);

    missing.forEach(function (id) { fig.appendChild(el("p", "missing", t("missingFigure", { id: id }))); });
    if (tg && !tg.f) fig.appendChild(el("p", "missing", t("missingFigure", { id: tg.id })));
    if (tg) figs.push(tg.f);
    addNote(fig, sourceNote(b.source, figs, ctx));
    return fig;
  }

  // Compare, plain: two columns with an arrow (also the tech document form).

        fig.appendChild(svg);
      }
      var head = el("div", "ratio-head");
      head.appendChild(figNode(ctx, str(b.ref), ctx.role === "doc" ? "fig-inline" : "ratio-value", true));
      if (b.label) { var lab = el("div", "ratio-label"); lab.appendChild(richText(b.label, ctx)); head.appendChild(lab); }
      fig.appendChild(head);
      if (b.max_ref && !m) fig.appendChild(el("p", "missing", t("missingFigure", { id: str(b.max_ref) })));
      if (isEstimate(f) || isEstimate(m)) fig.appendChild(estimateBadge());
      return fig;
    },
    compare: function (b, ctx) {
      var emph = b.emphasis === 0 ? 0 : 1;
      var sides = arr(b.sides).slice(0, 2);
      while (sides.length < 2) sides.push(null);
      if (ctx.role !== "doc" && b.form === "bars") return compareBars(b, ctx, sides, emph);
      if (ctx.role !== "doc" && b.form === "cards") return compareCards(b, ctx, sides, emph);
      return comparePlain(b, ctx, sides, emph);
    },
    options: function (b, ctx) {
      return ctx.role === "doc" ? optionCards(b, ctx) : optionRows(b, ctx);
    },
    timeline: function (b, ctx) {
      if (b.form === "gantt" && arr(b.lanes).length) return ctx.role === "doc" ? timelineGanttDoc(b, ctx) : timelineGantt(b, ctx);
      if (ctx.role !== "doc" && (b.form === "steps" || ctx.role === "aside")) return timelineSteps(b, ctx);
      return timelinePlain(b, ctx);
    },
    meter: function (b, ctx) {
      if (b.form === "gauge" && b.threshold_ref) return ctx.role === "doc" ? meterGaugeDoc(b, ctx) : meterGauge(b, ctx);
      if (b.form === "donut" && ctx.role !== "doc") return meterDonut(b, ctx);
      var fig = el("figure", "meter");
      var f = useFig(ctx, str(b.ref));
      var m = b.max_ref ? useFig(ctx, str(b.max_ref)) : null;
      var head = el("div", "meter-head");
      if (f) {
        var text = formatValue(f);
        if (m) text = (str(f.unit) === str(m.unit) ? formatPlain(f) : formatValue(f)) + " / " + formatValue(m);
        head.appendChild(el("span", "meter-value", text));
      } else {
        head.appendChild(el("span", "missing", t("missingFigure", { id: str(b.ref) })));
      }
      if (b.max_ref && !m) head.appendChild(el("span", "missing", t("missingFigure", { id: str(b.max_ref) })));
      if (b.label) head.appendChild(el("span", "meter-label", str(b.label)));
      fig.appendChild(head);
      var max = isNum(m) ? m.value : (f && str(f.unit) === "%" ? 100 : 0);
      if (isNum(f) && max > 0) {
        var pct = clamp((f.value / max) * 100, 0, 100);
        var svg = svgEl("svg", { viewBox: "0 0 100 6", preserveAspectRatio: "none", "aria-hidden": "true", focusable: "false", "class": "meter-svg" });
        svg.appendChild(svgEl("rect", { x: 0, y: 0, width: 100, height: 6, "class": "meter-track" }));
        svg.appendChild(svgEl("rect", { x: 0, y: 0, width: pct.toFixed(2), height: 6, "class": "meter-fill" }));
        fig.appendChild(svg);
      }
      if (isEstimate(f) || isEstimate(m)) fig.appendChild(estimateBadge());
      addNote(fig, sourceNote(b.source, [f, m], ctx));
      return fig;
    },
    tree: function (b, ctx) {
      var kids = arr(b.children).filter(isObj);
      if (ctx.role === "doc") {
        var wrap = el("div", "tree-doc");
        addNote(wrap, blockTitle(b, "block-title"));
        var ul = el("ul", "list");
        var li = el("li");
        li.appendChild(b.root ? el("strong", null, str(b.root)) : gapBadge());
        var sub = el("ul", "list");
        kids.forEach(function (k) {
          var item = el("li");
          item.appendChild(document.createTextNode(str(k.label) + ": "));
          item.appendChild(treeValue(k, ctx));
          sub.appendChild(item);
        });
        li.appendChild(sub);
        ul.appendChild(li);
        wrap.appendChild(ul);
        return wrap;
      }
      var fig = el("figure", "tree");
      addNote(fig, blockTitle(b));
      var root = el("div", "tree-root");
      if (b.root) root.appendChild(richText(b.root, ctx)); else root.appendChild(gapBadge());
      fig.appendChild(root);
      var row = el("div", "tree-kids");
      kids.forEach(function (k) {
        var node = el("div", "tree-node" + (k.highlight === true ? " is-hl" : ""));
        node.appendChild(el("div", "tree-label", str(k.label)));
        node.appendChild(treeValue(k, ctx));
        row.appendChild(node);
      });
      fig.appendChild(row);
      return fig;
    },
    journey: function (b, ctx) {
      var steps = arr(b.steps).map(str);
      var lanes = arr(b.lanes).filter(isObj);
      var cellOf = function (ln, i) {
        var c = arr(ln.cells)[i];
        return isObj(c) ? c : (typeof c === "string" ? { text: c } : null);
      };
      if (ctx.role === "doc") {
        var rows = lanes.map(function (ln) {
          return [str(ln.label)].concat(steps.map(function (s, i) { var c = cellOf(ln, i); return c && c.text ? str(c.text) : t("gap"); }));
        });
        return table([""].concat(steps), rows, ctx);
      }
      var hl = typeof b.highlight === "number" ? b.highlight : -1;
      var n = Math.max(steps.length, 1);
      var fig = el("figure", "journey");
      var cols = ["var(--j-label)"];
      for (var i = 0; i < n; i++) { if (i) cols.push("var(--j-arrow)"); cols.push("minmax(0, 1fr)"); }
      fig.style.setProperty("--j-cols", cols.join(" "));
      fig.appendChild(el("div", "j-corner"));
      steps.forEach(function (s, k) {
        if (k) fig.appendChild(el("div", "j-gap"));
        fig.appendChild(el("div", "j-step" + (k === hl ? " is-hl" : ""), s));
      });
      lanes.forEach(function (ln) {
        var emph = ln.emphasis === true;
        fig.appendChild(el("div", "j-lane" + (emph ? " is-emph" : ""), str(ln.label)));
        for (var k = 0; k < n; k++) {
          if (k) {
            var ar = el("div", "j-arrow" + (emph ? " is-emph" : ""));
            ar.appendChild(icon("arrow"));
            fig.appendChild(ar);
          }
          var o = cellOf(ln, k);
          var cell = el("div", "j-cell" + (emph ? " is-emph" : "") + (emph && k === hl ? " is-hl" : "") + (o && o.empty === true ? " is-empty" : ""));
          cell.appendChild(el("span", "j-cell-step", steps[k] || ""));
          if (!o || !o.text) {
            cell.appendChild(gapBadge());
          } else {
            var ic = el("span", "j-ico");
            ic.appendChild(icon(str(o.icon || "dot")));
            cell.appendChild(ic);
            var tx = el("span", "j-text");
            tx.appendChild(richText(o.text, ctx));
            cell.appendChild(tx);
          }
          fig.appendChild(cell);
        }
      });
      return fig;
    },
    callout: function (b, ctx) {
      if (ctx.role === "doc") {
        var p = el("p", "text");
        if (b.label) p.appendChild(el("strong", null, str(b.label) + ": "));
        if (b.text) p.appendChild(richText(b.text, ctx)); else p.appendChild(gapBadge());
        return p;
      }
      var box = el("div", "callout is-" + (b.tone === "risk" ? "risk" : "note") + (b.icon ? " has-ico" : ""));
      if (b.icon) box.appendChild(icon(str(b.icon), "callout-ico"));
      var body = el("div", "callout-body");
      if (b.label) body.appendChild(el("div", "callout-label", str(b.label)));
      var tx = el("div", "callout-text");
      if (b.text) tx.appendChild(richText(b.text, ctx)); else tx.appendChild(gapBadge());
      body.appendChild(tx);
      box.appendChild(body);
      return box;
    },
    controls: function (b, ctx) {
      var items = arr(b.items).map(function (it) { return isObj(it) ? it : (typeof it === "string" ? { text: it } : null); }).filter(Boolean);
      if (ctx.role === "doc") {
        var wrap = el("div", "controls-doc");
        addNote(wrap, blockTitle(b, "block-title"));
        var ol = el("ol", "list");
        items.forEach(function (it) {
          var li = el("li");
          li.appendChild(richText(it.text, ctx));
          if (it.note) { li.appendChild(document.createTextNode(" (")); li.appendChild(richText(it.note, ctx)); li.appendChild(document.createTextNode(")")); }
          ol.appendChild(li);
        });
        wrap.appendChild(ol);
        return wrap;
      }
      var box = el("div", "controls");
      if (b.title) box.appendChild(el("div", "block-label", str(b.title)));
      items.forEach(function (it, i) {
        var stop = it.stop === true;
        var card = el("div", "control" + (stop ? " is-stop" : ""));
        var mark = el("span", "control-mark");
        if (stop) mark.appendChild(icon("stop"));
        else if (it.icon) mark.appendChild(icon(str(it.icon)));
        else mark.appendChild(document.createTextNode(String(i + 1)));
        card.appendChild(mark);
        var body = el("div", "control-body");
        var tx = el("div", "control-text");
        tx.appendChild(richText(it.text, ctx));
        body.appendChild(tx);
        if (it.note) { var nt = el("div", "control-note"); nt.appendChild(richText(it.note, ctx)); body.appendChild(nt); }
        card.appendChild(body);
        box.appendChild(card);
      });
      return box;
    },
    deadline: function (b, ctx) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(b.date));
      if (ctx.role === "doc") {
        var p = el("p", "text");
        p.appendChild(el("strong", null, (str(b.label) || t("colWhen")) + ": "));
        if (m) p.appendChild(document.createTextNode(formatDate(str(b.date)))); else p.appendChild(gapBadge());
        if (b.note) { p.appendChild(document.createTextNode(" (")); p.appendChild(richText(b.note, ctx)); p.appendChild(document.createTextNode(")")); }
        return p;
      }
      var box = el("div", "deadline");
      if (m) {
        var cal = el("div", "cal");
        cal.setAttribute("role", "img");
        cal.setAttribute("aria-label", formatDate(str(b.date)));
        cal.appendChild(el("div", "cal-head", m[2] + "/" + m[1]));
        cal.appendChild(el("div", "cal-day", String(Number(m[3]))));
        box.appendChild(cal);
      } else {
        box.appendChild(gapBadge());
      }
      var body = el("div", "deadline-body");
      if (b.label) body.appendChild(el("div", "deadline-label", str(b.label)));
      if (b.note) { var nt = el("div", "deadline-note"); nt.appendChild(richText(b.note, ctx)); body.appendChild(nt); }
      box.appendChild(body);
      return box;
    },
    table: function (b, ctx) {
      var wrap = table(b.columns, b.rows, ctx);
      if (b.source) wrap.appendChild(el("div", "cap", t("source") + ": " + str(b.source)));
      return wrap;
    },
    stories: function (b, ctx) {
      var box = el("div", "stories");
      arr(b.items).forEach(function (s) {
        if (!isObj(s)) return;
        var art = el("article", "story");
        var h = el("h3", "story-title");
        if (s.priority) h.appendChild(el("span", "story-prio", str(s.priority)));
        var title = el("span");
        title.appendChild(richText(s.title, ctx));
        h.appendChild(title);
        art.appendChild(h);
        if (s.why) { var why = el("p", "story-why"); why.appendChild(richText(s.why, ctx)); art.appendChild(why); }
        var ol = el("ol", "scenarios");
        arr(s.scenarios).forEach(function (sc) {
          if (!isObj(sc)) return;
          var li = el("li");
          [["given", sc.given], ["when", sc.when], ["then", sc.then]].forEach(function (pair, i) {
            if (i) li.appendChild(document.createTextNode(" "));
            li.appendChild(el("strong", null, t(pair[0])));
            li.appendChild(document.createTextNode(" "));
            if (pair[1]) li.appendChild(richText(pair[1], ctx));
            else li.appendChild(gapBadge());
          });
          ol.appendChild(li);
        });
        if (ol.childNodes.length) art.appendChild(ol);
        box.appendChild(art);
      });
      return box;
    },
    defs: function (b, ctx) {
      var dl = el("dl", "defs");
      arr(b.items).forEach(function (it) {
        if (!isObj(it)) return;
        dl.appendChild(el("dt", null, str(it.term)));
        var dd = el("dd");
        if (it.meaning) dd.appendChild(richText(it.meaning, ctx));
        else dd.appendChild(gapBadge());
        dl.appendChild(dd);
      });
      return dl;
    },
    questions: function (b, ctx) {
      if (ctx.role === "cards") return questionCards(b, ctx);
      var box = el("div", "questions");
      [[true, "blocking"], [false, "nonBlocking"]].forEach(function (group) {
        var items = arr(b.items).filter(function (q) { return isObj(q) && (q.blocking === true) === group[0]; });
        box.appendChild(el("h3", "q-group" + (group[0] ? " blocking" : ""), t(group[1])));
        if (!items.length) { box.appendChild(el("p", "muted", t("noneBlocking"))); return; }
        var ul = el("ul", "list");
        items.forEach(function (q) {
          var li = el("li");
          if (q.id) li.appendChild(el("span", "item-id", str(q.id)));
          li.appendChild(richText(q.text, ctx));
          if (q.owner) li.appendChild(el("span", "q-owner", " (" + t("owner") + ": " + str(q.owner) + ")"));
          ul.appendChild(li);
        });
        box.appendChild(ul);
      });
      return box;
    },
    gap: function (b) {
      var p = el("p", "gap-line");
      p.appendChild(gapBadge(str(b.field)));
      return p;
    }
  };

  function validBlocks(blocks) {
    return arr(blocks).filter(function (b) { return isObj(b) && hasOwn.call(BLOCKS, b.type); });
  }

  function renderBlocks(blocks, ctx) {
    var frag = document.createDocumentFragment();
    validBlocks(blocks).forEach(function (b) {
      var node = BLOCKS[b.type](b, ctx);
      if (node) frag.appendChild(node);
    });
    return frag;
  }

  function frameworksLine(list, short) {
    var items = arr(list).map(function (fw) {
      return typeof fw === "string" ? { name: fw } : (isObj(fw) ? fw : null);
    }).filter(function (fw) { return fw && (fw.name || fw.id); });
    if (!items.length) return null;
    var p = el("p", "frameworks");
    p.appendChild(el("span", "line-label", t(short ? "frameworksShort" : "frameworks") + ": "));
    items.forEach(function (fw, i) {
      if (i) p.appendChild(document.createTextNode("; "));
      p.appendChild(document.createTextNode(str(fw.name || fw.id)));
      if (fw.result) p.appendChild(document.createTextNode(" (" + str(fw.result) + ")"));
    });
    return p;
  }

  function basedOn(fields) {
    var list = arr(fields).map(str).filter(Boolean);
    if (!list.length) return null;
    var p = el("p", "based-on");
    p.appendChild(el("span", "line-label", t("basedOn") + ": "));
    p.appendChild(document.createTextNode(list.join(", ")));
    return p;
  }

  function headerMeta(target) {
    if (readError) { target.appendChild(el("p", "notice bad", t("readError"))); return; }
    if (idea.version) target.appendChild(el("p", "meta", t("version", { date: formatDate(str(idea.version)) })));
    if (idea.draft === true) target.appendChild(el("p", "notice draft", t("draft")));
    var est = el("p", "notice");
    if (estimatePending) { est.appendChild(estimateBadge()); est.appendChild(document.createTextNode(" ")); }
    est.appendChild(document.createTextNode(estimatePending ? t("estimatePending") : t("estimateDone")));
    target.appendChild(est);
    var links = isObj(data.links) ? data.links : {};
    var ul = el("ul", "links");
    ["board_artifact", "tech_artifact", "slides", "docs"].forEach(function (key) {
      var href = links[key];
      if (typeof href === "string" && /^https:/i.test(href) && safeHref(href)) {
        var li = el("li");
        li.appendChild(link(t("link_" + key), href));
        ul.appendChild(li);
      }
    });
    if (ul.childNodes.length) {
      var wrap = el("div", "links-box");
      wrap.appendChild(el("span", "links-title", t("links") + ":"));
      wrap.appendChild(ul);
      target.appendChild(wrap);
    }
  }

  function gapsList() {
    var box = el("div", "gaps-list");
    box.appendChild(el("h3", null, t("gapsTitle")));
    if (!GAPS.length) { box.appendChild(el("p", "muted", t("noGaps"))); return box; }
    var ul = el("ul");
    GAPS.forEach(function (g) {
      var li = el("li");
      li.appendChild(gapBadge());
      li.appendChild(el("span", null, gapText(g.field)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }
  // ---- End of shared renderer ----

  // ---- Tech document ----
  var PLAIN_GAPS = false;
  var SECTION_MAP = [
    { id: "business-context", label: "sec_business_context", required: true },
    { id: "user-stories", label: "sec_user_stories", required: true },
    { id: "requirements", label: "sec_requirements", required: true },
    { id: "key-entities", label: "sec_key_entities", required: true },
    { id: "success-criteria", label: "sec_success_criteria", required: true },
    { id: "assumptions", label: "sec_assumptions", required: false },
    { id: "ai-fit", label: "sec_ai_fit", required: true },
    { id: "non-functional", label: "sec_non_functional", required: true },
    { id: "glossary", label: "sec_glossary", required: true },
    { id: "open-questions", label: "sec_open_questions", required: true }
  ];

  var tech = isObj(data.tech) ? data.tech : {};
  var byId = {};
  var extra = [];
  arr(tech.sections).forEach(function (s) {
    if (!isObj(s) || typeof s.id !== "string" || hasOwn.call(byId, s.id)) return;
    byId[s.id] = s;
  });
  var known = {};
  SECTION_MAP.forEach(function (slot) { known[slot.id] = true; });
  arr(tech.sections).forEach(function (s) {
    if (isObj(s) && typeof s.id === "string" && !known[s.id] && byId[s.id] === s) extra.push({ id: s.id, label: null, required: false });
  });

  document.getElementById("idea-title").textContent = str(idea.title);
  if (idea.title) document.title = "vibebiz · " + str(idea.title);
  headerMeta(document.getElementById("doc-head"));

  var toc = document.getElementById("toc");
  var box = document.getElementById("sections");

  function addToc(label, anchor) {
    var li = el("li");
    // In-page anchor built from a sanitized id; not a data URL, so it skips safeHref.
    var a = el("a", null, label);
    a.setAttribute("href", "#" + anchor);
    li.appendChild(a);
    toc.appendChild(li);
  }

  SECTION_MAP.concat(extra).forEach(function (slot) {
    var s = hasOwn.call(byId, slot.id) ? byId[slot.id] : null;
    if (!s && !slot.required) return;
    var ctx = { refs: [], role: "doc" };
    var heading = s && s.heading ? str(s.heading) : (slot.label ? t(slot.label) : slot.id);
    var anchor = "sec-" + slot.id.replace(/[^A-Za-z0-9_-]/g, "-");

    var sec = el("section", "doc-section");
    sec.setAttribute("id", anchor);
    sec.appendChild(el("h2", null, heading));

    var content = s ? s.content : null;
    var blocks = typeof content === "string" ? (content ? [{ type: "text", text: content }] : []) : arr(content);
    var gaps = gapsFor("section", slot.id);
    if (!blocks.length || gaps.length) {
      var gbox = el("div", "section-gaps");
      if (!blocks.length && !gaps.length) gbox.appendChild(gapBadge());
      gaps.forEach(function (g) { gbox.appendChild(gapBadge(str(g.field))); });
      sec.appendChild(gbox);
    }
    sec.appendChild(renderBlocks(blocks, ctx));
    var diagram = s ? diagramSlot(s.diagram, ctx) : null;
    if (diagram) sec.appendChild(diagram);

    var meta = el("div", "section-meta");
    var fw = s ? frameworksLine(s.frameworks) : null;
    if (fw) meta.appendChild(fw);
    var src = sourcesLine(ctx);
    if (src) meta.appendChild(src);
    var based = s ? basedOn(s.source_fields) : null;
    if (based) meta.appendChild(based);
    if (meta.childNodes.length) sec.appendChild(meta);
    box.appendChild(sec);
    addToc(heading, anchor);
  });

  var figSec = document.getElementById("sec-figures");
  figSec.appendChild(el("h2", null, t("figuresTable")));
  if (FIG_ORDER.length) figSec.appendChild(figureTable(FIG_ORDER));
  else figSec.appendChild(gapBadge());
  addToc(t("figuresTable"), "sec-figures");

  var gapSec = document.getElementById("gaps");
  var gl = gapsList();
  var gh = gl.querySelector("h3");
  gapSec.appendChild(el("h2", null, gh ? gh.textContent : t("gapsTitle")));
  if (gh) gl.removeChild(gh);
  gapSec.appendChild(gl);
  addToc(t("gapsTitle"), "gaps");

  var snap = document.getElementById("snapshot-link");
  snap.appendChild(link("spec.md", "spec.md"));
  snap.appendChild(el("span", "muted", ". " + t("snapshotNote")));
  addToc(t("snapshot"), "sec-snapshot");

  // Mark the section in view in the nav.
  if (typeof IntersectionObserver !== "undefined") {
    var links = Array.prototype.slice.call(toc.querySelectorAll("a"));
    var current = null;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var id = entry.target.getAttribute("id");
        if (id === current) return;
        current = id;
        links.forEach(function (a) {
          if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "true");
          else a.removeAttribute("aria-current");
        });
      });
    }, { rootMargin: "-10% 0px -75% 0px" });
    Array.prototype.slice.call(document.querySelectorAll(".doc-section[id]")).forEach(function (sec) { observer.observe(sec); });
  }
})();
</script>
</body>
</html>
