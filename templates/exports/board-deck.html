<!--
  vibebiz board deck. Fixed template: vibebiz writes only the JSON block with
  id "vibebiz-data" (the idea's exports/data.json, unchanged); layout, styles
  and the renderer never change between runs.

  Layout: one slide per board.slides[] entry in a fixed map of nine slides plus
  the appendix (n 1-9, then "appendix"). A slide missing from the data, or with
  no blocks, still shows with a "not yet clarified" label; nothing is dropped.
  Each slide shows its title (the takeaway), its one message, its blocks, its
  diagram slot, the frameworks applied, and every figure it uses with source,
  period and the measured or assumed label. Figures come only from numbers[] by
  id, written in text as {{N-01}}, so every view shows the same value.

  Data shape beyond the export contract, read here and by the package module:
  - blocks[]: { type: "text", text } | { type: "list", items: [text | {id, text}] }
    | { type: "figures", items: [{ref, caption}] }
    | { type: "chart", kind: "bar", title, source, items: [{ref, caption}] }
    | { type: "table", columns: [], rows: [[]], source }
    | { type: "stories", items: [{priority, title, why, scenarios: [{given, when, then}]}] }
    | { type: "defs", items: [{term, meaning}] }
    | { type: "questions", items: [{id, text, owner, blocking}] }
    | { type: "gap", field }. Unknown types are skipped.
  - numbers[].estimate: true marks an estimate; while idea.estimate_status is
    not "tech-reviewed" it carries the "not tech-reviewed" label everywhere.
  - diagrams[]: { id (the brief id named by slide.diagram), message, svg
    (rendered SVG markup or null), fallback: {columns, rows} }. Without SVG the
    slot shows the "no diagram" note and the fallback table.
  - gaps[]: a field name, or { field, slide } / { field, section }.
  - frameworks[]: a name, or { id, name, result }.
  - links: { board_artifact, tech_artifact, slides, docs }, https URL or null.
  - labels: optional; see the label rule in the renderer.

  Security: self-contained (no external scripts, fonts or images), strict CSP,
  data inserted only with textContent, createTextNode and setAttribute; links
  pass safeHref. The single exception is inline SVG, sanitized as described at
  sanitizeSvg below. Escape every "<" in the JSON block as < so the block
  cannot close the script tag early; SVG markup inside it is escaped the same way.
  Print: one slide per page, landscape.
-->

  function formatDate(iso) {

    return m ? m[3] + "/" + m[2] + "/" + m[1] + (m[4] || "") : (iso || "");
  }

  // ---- Data ----
  var data = null;
  var readError = false;
  try {
    data = JSON.parse(document.getElementById("vibebiz-data").textContent);
  } catch (e) {
    readError = true;
  }
  if (!data || typeof data !== "object") { data = {}; readError = true; }

  var idea = data.idea && typeof data.idea === "object" ? data.idea : {};
  var lang = /^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$/.test(str(idea.language)) ? idea.language : "vi";
  var isVi = lang.toLowerCase() === "vi" || lang.toLowerCase().indexOf("vi-") === 0;
  var L = {};
  (function () {
    var base = isVi ? LABELS.vi : LABELS.en;
    var k;
    for (k in base) if (hasOwn.call(base, k)) L[k] = base[k];
    if (!isVi && data.labels && typeof data.labels === "object") {
      for (k in data.labels) {
        if (hasOwn.call(data.labels, k) && hasOwn.call(base, k) && typeof data.labels[k] === "string") L[k] = data.labels[k];
      }
    }
  })();
  document.documentElement.setAttribute("lang", lang);
  if (!isVi) {
    arr(Array.prototype.slice.call(document.querySelectorAll("[data-label]"))).forEach(function (node) {
      var key = node.getAttribute("data-label");
      if (hasOwn.call(L, key)) node.textContent = L[key];
    });
  }

  function t(key, vars) {
    var s = hasOwn.call(L, key) ? L[key] : key;
    return s.replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m;
    });
  }

  var estimatePending = idea.estimate_status !== "tech-reviewed";

  var FIG = {};
  arr(data.numbers).forEach(function (f) {
    if (f && typeof f.id === "string") FIG[f.id] = f;
  });

  var DIAG = {};
  arr(data.diagrams).forEach(function (d) {
    if (d && typeof d.id === "string") DIAG[d.id] = d;
  });

  // gaps[]: strings (the field) or { field, slide, section }.
  var GAPS = arr(data.gaps).map(function (g) {
    return typeof g === "string" ? { field: g } : (g && typeof g === "object" ? g : null);
  }).filter(Boolean);

  function gapsFor(key, value) {
    return GAPS.filter(function (g) { return g[key] !== undefined && String(g[key]) === String(value); });
  }

  // ---- Figures: always looked up by id in numbers[] ----
  function formatValue(f) {
    var v = f.value;
    var text;
    if (typeof v === "number" && isFinite(v)) {
      try { text = v.toLocaleString(isVi ? "vi-VN" : lang); } catch (e) { text = String(v); }
    } else {
      text = str(v);
    }
    var unit = str(f.unit);
    if (!unit) return text;
    return unit === "%" ? text + unit : text + " " + unit;
  }

  function isEstimate(f) { return f && f.estimate === true && estimatePending; }

  function useFig(ctx, id) {
    if (ctx.refs.indexOf(id) < 0) ctx.refs.push(id);
    return FIG[id] || null;
  }

  function estimateBadge() { return el("span", "badge warn est", t("notTechReviewed")); }

  function inlineFigure(id, ctx) {
    var f = useFig(ctx, id);
    if (!f) return el("span", "missing", t("missingFigure", { id: id }));
    var span = el("span", "fig-inline", formatValue(f));
    span.setAttribute("data-figure", id);
    var wrap = document.createDocumentFragment();
    wrap.appendChild(span);
    if (isEstimate(f)) { wrap.appendChild(document.createTextNode(" ")); wrap.appendChild(estimateBadge()); }
    return wrap;
  }

  // Text with figure references written as {{N-01}}; everything else stays plain text.
  function richText(text, ctx) {
    var frag = document.createDocumentFragment();
    var s = str(text);
    var re = /\{\{([A-Za-z0-9._-]+)\}\}/g;
    var last = 0;
    var m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      frag.appendChild(inlineFigure(m[1], ctx));
      last = re.lastIndex;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    return frag;
  }

  function gapBadge(field) {
    var b = el("span", "badge gap", field ? t("gapField", { field: field }) : t("gap"));
    return b;
  }

  function figureNotes(ctx) {
    if (!ctx.refs.length) return null;
    var box = el("div", "fig-notes");
    box.appendChild(el("div", "fig-notes-title", t("figures")));
    var ul = el("ul");
    ctx.refs.forEach(function (id) {
      var f = FIG[id];
      var li = el("li");
      li.appendChild(el("span", "fig-id", id));
      li.appendChild(document.createTextNode(" "));
      if (!f) {
        li.appendChild(el("span", "missing", t("missingFigure", { id: id })));
        ul.appendChild(li);
        return;
      }
      li.appendChild(el("strong", null, formatValue(f)));
      li.appendChild(document.createTextNode(" · " + t("source") + ": "));
      li.appendChild(f.source ? document.createTextNode(str(f.source)) : el("span", "missing", t("noSource")));
      li.appendChild(document.createTextNode(" · " + t("period") + ": "));
      li.appendChild(f.period ? document.createTextNode(str(f.period)) : el("span", "missing", t("noPeriod")));
      li.appendChild(document.createTextNode(" · "));
      if (f.label === "measured") li.appendChild(el("span", "badge ok", t("measured")));
      else if (f.label === "assumed") li.appendChild(el("span", "badge", t("assumed")));
      else li.appendChild(el("span", "missing", t("noLabel")));
      if (isEstimate(f)) { li.appendChild(document.createTextNode(" ")); li.appendChild(estimateBadge()); }
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  // ---- Inline SVG ----
  // Inline SVG is the one exception to text-only insertion. It is taken only
  // from the dedicated field diagrams[].svg, parsed with DOMParser as
  // image/svg+xml (never as HTML), and before insertion loses: <script>,
  // <foreignObject>, animation elements (they can rewrite attributes later),
  // embedding elements, any element outside the SVG namespace, every event
  // handler attribute (on*), and every href / xlink:href / src that does not
  // point inside the same SVG ("#id"). Markup that fails to parse, or whose
  // root is not <svg>, is dropped and the "no diagram" table shows instead.
  // The Content Security Policy above blocks any load regardless.
  var SVG_DROP = {
    script: 1, foreignobject: 1, animate: 1, animatemotion: 1, animatetransform: 1,
    set: 1, discard: 1, handler: 1, listener: 1, iframe: 1, embed: 1, object: 1,
    audio: 1, video: 1
  };

  function sanitizeSvg(markup) {
    if (typeof markup !== "string" || markup === "" || typeof DOMParser === "undefined") return null;
    var doc;
    try { doc = new DOMParser().parseFromString(markup, "image/svg+xml"); } catch (e) { return null; }
    var root = doc && doc.documentElement;
    if (!root || root.namespaceURI !== SVG_NS || String(root.localName).toLowerCase() !== "svg") return null;
    if (doc.getElementsByTagName("parsererror").length) return null;
    var nodes = [root].concat(Array.prototype.slice.call(root.getElementsByTagName("*")));
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var name = String(node.localName).toLowerCase();
      if (node !== root && (node.namespaceURI !== SVG_NS || SVG_DROP[name])) {
        if (node.parentNode) node.parentNode.removeChild(node);
        continue;
      }
      for (var j = node.attributes.length - 1; j >= 0; j--) {
        var attr = node.attributes[j];
        var local = String(attr.localName).toLowerCase();
        var value = String(attr.value).replace(/[\u0000-\u0020]+/g, "");
        var drop = local.indexOf("on") === 0 ||
          ((local === "href" || local === "src") && !/^#[A-Za-z0-9_.:-]*$/.test(value)) ||
          /javascript:|vbscript:/i.test(value);
        if (drop) node.removeAttributeNode(attr);
      }
    }
    return document.importNode(root, true);
  }

  function table(columns, rows, ctx) {
    var wrap = el("div", "table-wrap");
    var tbl = el("table");
    var cols = arr(columns);
    if (cols.length) {
      var thead = el("thead");
      var tr = el("tr");
      cols.forEach(function (c) { tr.appendChild(el("th", null, str(c))); });
      thead.appendChild(tr);
      tbl.appendChild(thead);
    }
    var tbody = el("tbody");
    arr(rows).forEach(function (row) {
      var r = el("tr");
      arr(row).forEach(function (cell) {
        var td = el("td");
        td.appendChild(richText(cell, ctx));
        r.appendChild(td);
      });
      tbody.appendChild(r);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    return wrap;
  }

  function diagramSlot(id, ctx) {
    if (!id) return null;
    var d = DIAG[id] || null;
    var fig = el("figure", "diagram");
    var svg = d ? sanitizeSvg(d.svg) : null;
    if (svg) {
      svg.setAttribute("role", "img");
      if (d.message) svg.setAttribute("aria-label", str(d.message));
      fig.appendChild(svg);
      if (d.message) fig.appendChild(el("figcaption", null, str(d.message)));
      return fig;
    }
    fig.className = "diagram none";
    fig.appendChild(el("p", "no-diagram", t("noDiagram")));
    if (d && d.message) fig.appendChild(el("figcaption", null, str(d.message)));
    if (d && d.fallback && typeof d.fallback === "object") fig.appendChild(table(d.fallback.columns, d.fallback.rows, ctx));
    return fig;
  }

  // ---- Blocks (board slides and tech sections share them) ----
  function figItems(block) {
    return arr(block.items || block.refs).map(function (it) {
      return typeof it === "string" ? { ref: it } : (it && typeof it === "object" ? it : null);
    }).filter(Boolean);
  }

  var BLOCKS = {
    text: function (b, ctx) {
      var p = el("p", "text");
      p.appendChild(richText(b.text, ctx));
      return p;
    },
    list: function (b, ctx) {
      var ul = el(b.ordered ? "ol" : "ul", "list");
      arr(b.items).forEach(function (it) {
        var li = el("li");
        if (it && typeof it === "object") {
          if (it.id) { li.appendChild(el("strong", "item-id", str(it.id))); li.appendChild(document.createTextNode(" ")); }
          li.appendChild(richText(it.text, ctx));
        } else {
          li.appendChild(richText(it, ctx));
        }
        ul.appendChild(li);
      });
      return ul;
    },
    figures: function (b, ctx) {
      var grid = el("div", "kpis");
      figItems(b).forEach(function (it) {
        var f = useFig(ctx, str(it.ref));
        var tile = el("div", "kpi");
        tile.appendChild(f ? el("div", "kpi-value", formatValue(f)) : el("div", "kpi-value missing", t("missingFigure", { id: it.ref })));
        if (it.caption) tile.appendChild(el("div", "kpi-caption", str(it.caption)));
        if (f && isEstimate(f)) tile.appendChild(estimateBadge());
        grid.appendChild(tile);
      });
      return grid;
    },
    chart: function (b, ctx) {
      var fig = el("figure", "chart");
      if (b.title) fig.appendChild(el("div", "chart-title", str(b.title)));
      var items = figItems(b);
      var max = 0;
      items.forEach(function (it) {
        var f = FIG[it.ref];
        if (f && typeof f.value === "number" && f.value > max) max = f.value;
      });
      items.forEach(function (it) {
        var f = useFig(ctx, str(it.ref));
        var row = el("div", "bar-row");
        row.appendChild(el("div", "bar-label", str(it.caption || it.ref)));
        var track = el("div", "bar-track");
        var fill = el("span", "bar-fill");
        var pct = f && typeof f.value === "number" && max > 0 ? Math.max(2, Math.round((f.value / max) * 100)) : 0;
        fill.style.width = pct + "%";
        track.appendChild(fill);
        row.appendChild(track);
        var val = el("div", "bar-value");
        if (f) {
          val.appendChild(document.createTextNode(formatValue(f)));
          if (isEstimate(f)) { val.appendChild(document.createTextNode(" ")); val.appendChild(estimateBadge()); }
        } else {
          val.appendChild(el("span", "missing", t("missingFigure", { id: it.ref })));
        }
        row.appendChild(val);
        fig.appendChild(row);
      });
      var cap = el("figcaption", "chart-source");
      if (b.source) cap.textContent = t("source") + ": " + str(b.source);
      else { cap.className = "chart-source missing"; cap.textContent = t("chartNoSource"); }
      fig.appendChild(cap);
      return fig;
    },
    table: function (b, ctx) {
      var wrap = table(b.columns, b.rows, ctx);
      if (b.source) wrap.appendChild(el("div", "table-source", t("source") + ": " + str(b.source)));
      return wrap;
    },
    stories: function (b, ctx) {
      var box = el("div", "stories");
      arr(b.items).forEach(function (s) {
        if (!s || typeof s !== "object") return;
        var art = el("article", "story");
        var h = el("h3", "story-title");
        if (s.priority) { h.appendChild(el("span", "badge", str(s.priority))); h.appendChild(document.createTextNode(" ")); }
        h.appendChild(richText(s.title, ctx));
        art.appendChild(h);
        if (s.why) { var why = el("p", "story-why"); why.appendChild(richText(s.why, ctx)); art.appendChild(why); }
        var ol = el("ol", "scenarios");
        arr(s.scenarios).forEach(function (sc) {
          if (!sc || typeof sc !== "object") return;
          var li = el("li");
          [["given", sc.given], ["when", sc.when], ["then", sc.then]].forEach(function (pair, i) {
            if (i) li.appendChild(document.createTextNode(" "));
            li.appendChild(el("strong", null, t(pair[0])));
            li.appendChild(document.createTextNode(" "));
            if (pair[1]) li.appendChild(richText(pair[1], ctx));
            else li.appendChild(gapBadge());
          });
          ol.appendChild(li);
        });
        if (ol.childNodes.length) art.appendChild(ol);
        box.appendChild(art);
      });
      return box;
    },
    defs: function (b, ctx) {
      var dl = el("dl", "defs");
      arr(b.items).forEach(function (it) {
        if (!it || typeof it !== "object") return;
        dl.appendChild(el("dt", null, str(it.term)));
        var dd = el("dd");
        if (it.meaning) dd.appendChild(richText(it.meaning, ctx));
        else dd.appendChild(gapBadge());
        dl.appendChild(dd);
      });
      return dl;
    },
    questions: function (b, ctx) {
      var box = el("div", "questions");
      [[true, "blocking"], [false, "nonBlocking"]].forEach(function (group) {
        var items = arr(b.items).filter(function (q) { return q && typeof q === "object" && (q.blocking === true) === group[0]; });
        box.appendChild(el("h3", "q-group" + (group[0] ? " blocking" : ""), t(group[1])));
        if (!items.length) { box.appendChild(el("p", "muted", t("noneBlocking"))); return; }
        var ul = el("ul", "list");
        items.forEach(function (q) {
          var li = el("li");
          if (q.id) { li.appendChild(el("strong", "item-id", str(q.id))); li.appendChild(document.createTextNode(" ")); }
          li.appendChild(richText(q.text, ctx));
          if (q.owner) li.appendChild(el("span", "muted", " · " + t("owner") + ": " + str(q.owner)));
          ul.appendChild(li);
        });
        box.appendChild(ul);
      });
      return box;
    },
    gap: function (b) {
      var p = el("p", "gap-line");
      p.appendChild(gapBadge(str(b.field)));
      return p;
    }
  };

  function renderBlocks(blocks, ctx) {
    var frag = document.createDocumentFragment();
    arr(blocks).forEach(function (b) {
      if (!b || typeof b !== "object" || !hasOwn.call(BLOCKS, b.type)) return;
      var node = BLOCKS[b.type](b, ctx);
      if (node) frag.appendChild(node);
    });
    return frag;
  }

  function frameworksBox(list) {
    var items = arr(list).map(function (fw) {
      return typeof fw === "string" ? { name: fw } : (fw && typeof fw === "object" ? fw : null);
    }).filter(function (fw) { return fw && (fw.name || fw.id); });
    if (!items.length) return null;
    var box = el("div", "frameworks");
    box.appendChild(el("span", "frameworks-title", t("frameworks") + ": "));
    items.forEach(function (fw, i) {
      if (i) box.appendChild(document.createTextNode(" · "));
      box.appendChild(el("strong", null, str(fw.name || fw.id)));
      if (fw.result) box.appendChild(document.createTextNode(" (" + str(fw.result) + ")"));
    });
    return box;
  }

  function basedOn(fields) {
    var list = arr(fields).map(str).filter(Boolean);
    if (!list.length) return null;
    return el("div", "based-on", t("basedOn") + ": " + list.join(", "));
  }

  function headerMeta(target) {
    if (readError) { target.appendChild(el("p", "notice bad", t("readError"))); return; }
    if (idea.version) target.appendChild(el("p", "meta", t("version", { date: formatDate(str(idea.version)) })));
    if (idea.draft === true) target.appendChild(el("p", "notice", t("draft")));
    target.appendChild(el("p", estimatePending ? "notice" : "notice ok", estimatePending ? t("estimatePending") : t("estimateDone")));
    var links = data.links && typeof data.links === "object" ? data.links : {};
    var ul = el("ul", "links");
    ["board_artifact", "tech_artifact", "slides", "docs"].forEach(function (key) {
      var href = links[key];
      if (typeof href === "string" && /^https:/i.test(href) && safeHref(href)) {
        var li = el("li");
        li.appendChild(link(t("link_" + key), href));
        ul.appendChild(li);
      }
    });
    if (ul.childNodes.length) {
      var wrap = el("div", "links-box");
      wrap.appendChild(el("span", "links-title", t("links") + ": "));
      wrap.appendChild(ul);
      target.appendChild(wrap);
    }
  }

  function gapsList() {
    var box = el("div", "gaps-list");
    box.appendChild(el("h3", null, t("gapsTitle")));
    if (!GAPS.length) { box.appendChild(el("p", "muted", t("noGaps"))); return box; }
    var ul = el("ul", "list");
    GAPS.forEach(function (g) {
      var li = el("li");
      li.appendChild(gapBadge());
      li.appendChild(document.createTextNode(" " + str(g.field)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }
  // ---- End of shared renderer ----

  // ---- Board deck ----
  var SLIDE_MAP = [
    { n: 1, label: "slide1" }, { n: 2, label: "slide2" }, { n: 3, label: "slide3" },
    { n: 4, label: "slide4" }, { n: 5, label: "slide5" }, { n: 6, label: "slide6" },
    { n: 7, label: "slide7" }, { n: 8, label: "slide8" }, { n: 9, label: "slide9" },
    { n: "appendix", label: "slideAppendix" }
  ];

  var board = data.board && typeof data.board === "object" ? data.board : {};
  var byN = {};
  arr(board.slides).forEach(function (s) {
    if (!s || typeof s !== "object") return;
    var key = s.n === 10 ? "appendix" : String(s.n);
    if (!hasOwn.call(byN, key)) byN[key] = s;
  });

  document.getElementById("idea-title").textContent = str(idea.title);
  if (idea.title) document.title = "vibebiz · " + str(idea.title);
  headerMeta(document.getElementById("deck-head"));

  var box = document.getElementById("slides");
  SLIDE_MAP.forEach(function (slot) {
    var s = byN[String(slot.n)] || null;
    var ctx = { refs: [] };
    var sec = el("section", "slide");
    sec.setAttribute("id", "slide-" + slot.n);

    var kicker = el("div", "slide-kicker");
    kicker.appendChild(el("span", null, (slot.n === "appendix" ? t("appendix") : t("page", { n: slot.n })) + " · " + t(slot.label)));
    if (idea.draft === true) kicker.appendChild(el("span", "badge warn", t("draftShort")));
    sec.appendChild(kicker);

    var h2 = el("h2", "slide-title");
    h2.appendChild(s && s.title ? richText(s.title, ctx) : document.createTextNode(t(slot.label)));
    sec.appendChild(h2);
    if (s && s.message) { var msg = el("p", "slide-message"); msg.appendChild(richText(s.message, ctx)); sec.appendChild(msg); }

    var gaps = gapsFor("slide", slot.n);
    var empty = !s || !arr(s.blocks).length;
    if (empty || gaps.length) {
      var gbox = el("div", "slide-gaps");
      if (empty && !gaps.length) gbox.appendChild(gapBadge());
      gaps.forEach(function (g) { gbox.appendChild(gapBadge(str(g.field))); });
      sec.appendChild(gbox);
    }

    var body = el("div", "slide-body");
    if (s) body.appendChild(renderBlocks(s.blocks, ctx));
    if (slot.n === "appendix") body.appendChild(gapsList());
    var diagram = s ? diagramSlot(s.diagram, ctx) : null;
    if (diagram) body.appendChild(diagram);
    sec.appendChild(body);

    var foot = el("div", "slide-foot");
    var fw = s ? frameworksBox(s.frameworks) : null;
    if (fw) foot.appendChild(fw);
    var notes = figureNotes(ctx);
    if (notes) foot.appendChild(notes);
    var based = s ? basedOn(s.source_fields) : null;
    if (based) foot.appendChild(based);
    if (foot.childNodes.length) sec.appendChild(foot);

    box.appendChild(sec);
  });
})();
</script>
</body>
</html>
