<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>vibebiz · Trình ban lãnh đạo</title>
<!--
  vibebiz board deck. Fixed template: vibebiz writes only the JSON block with
  id "vibebiz-data" (the idea's exports/data.json, unchanged); layout, styles
  and the renderer never change between runs.

  Layout: one 16:9 slide per board.slides[] entry in a fixed map of nine
  slides plus the appendix (n 1-9, then "appendix"), followed by a trace page:
  the figures counted by kind (measured, assumed, estimate), a matrix of which
  slide uses figures from which source, and the fields each slide came from.
  A slide missing from the data, or with no blocks, still shows with a "not
  yet clarified" tag; nothing is dropped.

  Each slide: the title (the takeaway), the one message, one hero visual
  chosen from the slide's content, a side column or a row below for the
  supporting blocks, and a one-line footer with figure sources (source,
  period, measured or assumed), the frameworks applied with their result, and
  any notes. Text, list and callout blocks that would push the message and
  body past about 30 words move to the footer notes line; the appendix and
  the trace page have no limit. Figures come only from numbers[] by id,
  written in text as {{N-01}} and in blocks as a ref field, so every view
  shows the same value. Large money figures are shown scaled ("180 triệu đ");
  the tech document's figures table shows the full value.

  Data shape beyond the export contract, read here and by the package module:
  - slide.layout (optional): the hero to use: "number" (first figures block),
    "bars" or "line" (a chart block of that kind), "ratio", "compare",
    "options", "timeline", "meter", "tree", "journey", "table", "list", or
    "diagram" (the slide's diagram). Without it, or when no block matches, the
    renderer picks: a diagram with SVG, then journey, compare, options,
    timeline, chart, ratio, figures, meter, tree, table, controls, list, a
    diagram without SVG (its fallback table), then text.
  - block.place (optional): "hero" puts a supporting block under the hero
    instead of beside it. A list with form "chips" stays with the block
    before it.
  - blocks[]: { type: "text", text }
    | { type: "list", title, form: "chips", items: [text | {id, text, icon}] }
    | { type: "figures", items: [{ref, to_ref, caption, icon, highlight}] }
        (the first item is the hero number; to_ref shows a range, "18→24%")
    | { type: "chart", kind: "bar" | "line", title, source, period,
        items: [{ref, caption, highlight}], target: {ref, label} }
        (target draws a reference line, for example a goal or a cost)
    | { type: "ratio", ref, max_ref, total, label } (pictogram: "1 of 5
        people"; the share is ref / max_ref, or ref / 100 for a % figure;
        total is the number of people drawn, a whole number from 2 to 10,
        default 5: 18% is drawn as about 1 of 5, never total 100)
    | { type: "compare", form: "bars" | "cards", title, source,
        emphasis: 0 | 1 (default 1),
        sides: [{label, ref, caption, items: [text | {text, ref, icon}]}, {...}] }
        (before and after, now and later; "bars" draws the two figures as
        bars, "cards" shows each item as a card under a count)
    | { type: "options", measure, items: [{name, summary, pros, cons, chosen,
        ref, ref_high}] } (ref, or ref to ref_high, is the option's figure for
        the measure, drawn as a bar, for example the time until it runs)
    | { type: "timeline", form: "steps" | "gantt", source,
        items: [{when, what, decision, at}] } (decision marks a decision
        point). "gantt" adds axis_label, span_ref (the figure giving the
        length; otherwise the largest position) and
        lanes: [{label, ref, emphasis, bars: [{from, to, text, emphasis, gap}]}];
        from, to and at are whole-number positions on the axis (weeks,
        months) counted from 1, with from <= to: a 12-week pilot is
        from 1 to 12, never from 0.
    | { type: "meter", form: "donut" | "gauge", ref, max_ref, label, source }
        (max is max_ref's value, or 100 for a % figure). "gauge" adds
        threshold_ref (required), below and above (zone names), note.
    | { type: "tree", title, root, children: [{label, ref, to_ref, text, highlight}] }
    | { type: "journey", steps: [text], highlight (step index),
        lanes: [{label, emphasis, cells: [{text, icon, empty}]}] }
        (one cell per step)
    | { type: "callout", tone: "risk" | "note", label, text, icon }
    | { type: "controls", title, items: [{text, note, icon, stop}] }
        (numbered control cards; stop marks the stop rule)
    | { type: "deadline", date (YYYY-MM-DD), label, note }
    | { type: "table", columns: [], rows: [[]], source }
    | { type: "stories", items: [{priority, title, why, scenarios: [{given, when, then}]}] }
    | { type: "defs", items: [{term, meaning}] }
    | { type: "questions", items: [{id, text, owner, blocking}] }
    | { type: "gap", field }. Unknown types and forms fall back: an unknown
    type is skipped, an unknown form draws the plain block.
    Any slide, section or block may carry estimate_label: "not tech-reviewed"
    for the package check; the renderer does not need it.
  - icon names (list items, figure items, cards): target, coin, clock, store,
    people, peoplecheck, chat, alert, stop, check, plus, minus, flag,
    calendar, chart, trend, bulb, box, bag, bagcheck, tag, list, gift, sun,
    phone, shield, close, question, arrow, dot. Unknown names fall back to a
    dot.
  - numbers[].estimate: true marks an estimate; while idea.estimate_status is
    not "tech-reviewed" it carries the "not tech-reviewed" badge everywhere.
  - diagrams[]: { id (the brief id named by slide.diagram), message, svg
    (rendered SVG markup or null), fallback: {columns, rows} }. Without SVG the
    slot shows the "no diagram" note and the fallback table.
  - gaps[]: a field name, or { field, slide } / { field, section }.
  - frameworks[]: a name, or { id, name, result }.
  - links: { board_artifact, tech_artifact, slides, docs }, https URL or null.
  - labels: optional; see the label rule in the renderer.
  - theme (optional): brand tokens, see the token comment in the styles.

  Security: self-contained (no external scripts, fonts or images), strict CSP,
  data inserted only with textContent, createTextNode and setAttribute; links
  pass safeHref. Charts and icons are SVG built by the renderer with
  createElementNS and setAttribute. The single exception to text-only
  insertion is diagram SVG, sanitized as described at sanitizeSvg below.
  Escape every "<" in the JSON block as \u003c so the block cannot close the
  script tag early; SVG markup inside it is escaped the same way.
  Print: one slide per landscape 16:9 page.
-->
<style>
  /* ---- Shared styles (identical in board-deck.html and tech-prd.html) ---- */

  /* Tokens. The brand group is the only part a brand profile changes. To apply
     a profile from the diagram-design plugin, copy its colors and font stacks
     into data.json "theme": { "light": {accent, accent_soft, ink, quiet,
     canvas, surface, rule, mark}, "dark": {same keys}, "fonts": {display,
     text} }. The renderer accepts only #hex colors and plain font names and
     sets them as --brand-<key>-light / --brand-<key>-dark / --brand-font-<key>
     on the page, which the defaults below read first. Status colors (gaps,
     estimates, errors) stay fixed so labels keep their meaning in any brand. */
  :root {
    /* Brand: colors (light) */
    --accent: var(--brand-accent-light, #0b6e66);
    --accent-soft: var(--brand-accent-soft-light, #dcefec);
    --ink: var(--brand-ink-light, #18202c);
    --quiet: var(--brand-quiet-light, #5a6474);
    --canvas: var(--brand-canvas-light, #e9ecf0);
    --surface: var(--brand-surface-light, #ffffff);
    --rule: var(--brand-rule-light, #d5dae1);
    --mark: var(--brand-mark-light, #aeb6c2);
    /* Brand: type */
    --font-display: var(--brand-font-display, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    --font-text: var(--brand-font-text, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    /* Status (fixed) */
    --gap-ink: #8a6416;
    --gap-line: #d6bd85;
    --est-ink: #5a6474;
    --est-line: #c3cad4;
    --bad-ink: #a3362a;
    --risk-ink: #9a4a08;
    --risk-soft: #fff4e5;
    --risk-line: #f1c9a0;
    /* Derived neutrals (fixed): card tint, secondary ink, text on the accent */
    --tint: #f3f5f7;
    --ink-2: #3d4654;
    --on-accent: #ffffff;
    /* Type scale, document (rem); slides override with frame-relative sizes */
    --fs-h1: 2rem;
    --fs-h2: 1.375rem;
    --fs-body: 1rem;
    --fs-small: 0.8125rem;
    --fs-badge: 0.72rem;
    --big: 2.25rem;
    /* Spacing */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 16px;
    --sp-4: 24px;
    --sp-5: 40px;
    --sp-6: 64px;
    --radius: 6px;
    --tl-mark: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: var(--brand-accent-dark, #4cc3b2);
      --accent-soft: var(--brand-accent-soft-dark, #143a36);
      --ink: var(--brand-ink-dark, #e7eaef);
      --quiet: var(--brand-quiet-dark, #98a2b2);
      --canvas: var(--brand-canvas-dark, #0c0f14);
      --surface: var(--brand-surface-dark, #151a21);
      --rule: var(--brand-rule-dark, #2a313c);
      --mark: var(--brand-mark-dark, #4a5363);
      --gap-ink: #d9b25c;
      --gap-line: #6e5a2c;
      --est-ink: #a9b2c0;
      --est-line: #3a4250;
      --bad-ink: #f0a093;
      --risk-ink: #f0b27a;
      --risk-soft: #2e2216;
      --risk-line: #7a4a1f;
      --tint: #1d232c;
      --ink-2: #c3cad4;
      --on-accent: #0c0f14;
    }
  }
  @media print {
    :root {
      --accent: var(--brand-accent-light, #0b6e66);
      --accent-soft: var(--brand-accent-soft-light, #dcefec);
      --ink: var(--brand-ink-light, #18202c);
      --quiet: var(--brand-quiet-light, #4a5262);
      --canvas: #ffffff;
      --surface: #ffffff;
      --rule: var(--brand-rule-light, #c9ced6);
      --mark: var(--brand-mark-light, #9aa3b0);
      --gap-ink: #6f500f;
      --gap-line: #c2a66a;
      --est-ink: #4a5262;
      --est-line: #aab2bd;
      --bad-ink: #8a2a20;
      --risk-ink: #8a3f05;
      --risk-soft: #fff4e5;
      --risk-line: #f1c9a0;
      --tint: #f3f5f7;
      --ink-2: #3d4654;
      --on-accent: #ffffff;
    }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    a { color: inherit; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: var(--fs-body);
    line-height: 1.5;
  }
  a { color: var(--accent); text-underline-offset: 0.15em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .missing { color: var(--bad-ink); font-style: italic; }
  .muted { color: var(--quiet); }

  /* Icons: inline SVG paths drawn by the renderer */
  .ico {
    width: 1.15em; height: 1.15em; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.2em;
  }

  /* Labels: present but quiet */
  .tag-gap {
    display: inline-flex; align-items: center; gap: 0.45em;
    padding: 0.1em 0.7em;
    border: 1px dashed var(--gap-line); border-radius: 999px;
    color: var(--gap-ink); font-size: var(--fs-small); font-weight: 500;
    line-height: 1.5;
  }
  .tag-gap::before {
    content: ""; width: 0.5em; height: 0.5em; flex: none;
    border: 1.5px solid currentColor; border-radius: 50%;
  }
  .badge-est {
    display: inline-block; vertical-align: middle;
    padding: 0 0.5em;
    border: 1px solid var(--est-line); border-radius: 4px;
    color: var(--est-ink); font-size: var(--fs-badge); font-weight: 500;
    letter-spacing: 0; line-height: 1.6; white-space: nowrap;
  }
  .num-value + .badge-est, .num-body > .badge-est { margin-top: 0.4em; }
  .fig-inline { font-weight: 650; font-variant-numeric: tabular-nums; }
  .fig-inline + .badge-est { margin-left: 0.35em; }
  .item-id { color: var(--quiet); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 0.4em; }

  /* Text blocks */
  .text { margin: 0; max-width: 62ch; }
  .list { margin: 0; padding-left: 1.2em; display: grid; gap: 0.35em; }
  .list-ico { list-style: none; padding-left: 0; gap: 0.7em; }
  .list-ico li { display: grid; grid-template-columns: auto 1fr; gap: 0.65em; align-items: start; }
  .list-ico .ico { color: var(--accent); width: 1.35em; height: 1.35em; margin-top: 0.05em; }

  /* Numbers */
  .nums { display: grid; gap: var(--sp-3); }
  .nums-row { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-5); }
  .num { display: grid; grid-template-columns: auto 1fr; gap: 0.6em; align-items: start; }
  .num-ico { color: var(--quiet); width: 1.3em; height: 1.3em; margin-top: 0.2em; }
  .num-body { grid-column: 2; display: grid; justify-items: start; }
  .num > .num-body:only-child { grid-column: 1 / -1; }
  .num-value {
    font-family: var(--font-display); font-weight: 700;
    font-size: calc(var(--big) * 0.5); line-height: 1.05;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .num-caption { color: var(--quiet); }
  .num-hero .num-value {
    font-size: var(--big); font-weight: 750; letter-spacing: -0.04em;
    line-height: 0.95; color: var(--accent);
  }
  .num-hero .num-value.is-long { font-size: calc(var(--big) * 0.6); letter-spacing: -0.03em; }
  .num-hero .num-caption { margin-top: 0.45em; font-size: 1.15em; color: var(--ink); }

  /* Charts */
  .chart, .compare-wrap, .timeline-wrap, .meter, .diagram { margin: 0; min-width: 0; }
  .chart-title { font-weight: 650; margin-bottom: 0.7em; }
  .cap { margin-top: 0.75em; font-size: var(--fs-small); color: var(--quiet); line-height: 1.4; }
  /* Bars: label column and track column; rows are placed by the renderer so
     a target line can span them. */
  .bars {
    position: relative; display: grid; grid-template-columns: minmax(4.5em, 16%) minmax(0, 1fr);
    gap: 0.7em 0.9em; align-items: center;
  }
  .bars.has-target { padding-top: 2.2em; }
  .bar-label { color: var(--quiet); }
  .bar-track { display: flex; align-items: center; gap: 0.6em; min-width: 0; }
  .bar-fill { display: block; flex: none; height: 1.6em; background: var(--mark); border-radius: 0 4px 4px 0; }
  .bar-row-above .bar-fill { background: #8fcfc6; background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
  .bar-row-hl .bar-fill { background: var(--accent); }
  .bar-row-below .bar-fill { background: var(--mark); }
  .bar-label.bar-row-hl { color: var(--ink); font-weight: 600; }
  .bar-value { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-value .badge-est { margin-left: 0.4em; }
  .bar-target { grid-column: 2; position: relative; align-self: stretch; pointer-events: none; }
  .bar-target-line { position: absolute; top: -2.2em; bottom: 0; border-left: 2px dashed var(--risk-ink); }
  .bar-target-label { position: absolute; top: 0; left: 0.5em; white-space: nowrap; color: var(--risk-ink); font-weight: 700; font-size: var(--fs-small); }
  .bar-target.is-missing .bar-target-line { border-left: 0; }
  .line-target { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 6; }
  .line-target-label { fill: var(--accent); font-weight: 700; }
  .line-path.is-ink { stroke: var(--ink); }
  .line-dot.is-ink { stroke: var(--ink); }
  .block-title { font-weight: 650; margin-bottom: 0.6em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .line-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .line-svg text { font-family: var(--font-text); }
  .line-base { stroke: var(--rule); stroke-width: 1; }
  .line-path { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .line-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
  .line-val { fill: var(--ink); font-weight: 650; }
  .line-x { fill: var(--quiet); }
  .chart-est { margin: 0.4em 0 0; }

  /* Before and after, now and later */
  .compare {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: var(--sp-4); align-items: start;
  }
  .side { border-top: 3px solid var(--rule); padding-top: 0.7em; display: grid; gap: 0.35em; align-content: start; justify-items: start; }
  .side.is-emph { border-top-color: var(--accent); }
  .side-label { color: var(--quiet); font-weight: 600; }
  .side.is-emph .side-label { color: var(--ink); }
  .side-value {
    font-family: var(--font-display); font-weight: 750;
    font-size: calc(var(--big) * 0.8); line-height: 1; letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums; color: var(--quiet);
  }
  .side.is-emph .side-value { color: var(--accent); }
  .side-caption { color: var(--quiet); }
  .side-list { list-style: none; margin: 0.2em 0 0; padding: 0; display: grid; gap: 0.45em; }
  .side-list li { display: grid; grid-template-columns: auto 1fr; gap: 0.55em; align-items: start; }
  .side-list .ico { color: var(--mark); margin-top: 0.1em; }
  .side.is-emph .side-list .ico { color: var(--accent); }
  .compare-arrow { align-self: center; color: var(--quiet); width: 1.8em; height: 1.8em; }

  /* Options compared */
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5em), 1fr)); gap: var(--sp-4); }
  .opt { border-top: 3px solid var(--rule); padding-top: 0.7em; display: grid; gap: 0.4em; align-content: start; }
  .opt.is-chosen { border-top-color: var(--accent); }
  .opt-name { font-weight: 700; font-size: 1.12em; line-height: 1.25; }
  .opt.is-chosen .opt-name { color: var(--accent); }
  .opt-chosen { display: inline-flex; align-items: center; gap: 0.3em; color: var(--accent); font-size: var(--fs-small); font-weight: 600; }
  .opt-summary { color: var(--quiet); }
  .opt-line { display: grid; grid-template-columns: auto 1fr; gap: 0.45em; align-items: start; }
  .opt-line .ico { margin-top: 0.15em; color: var(--quiet); }
  .opt-pro .ico { color: var(--accent); }

  /* Timeline */
  .tl {
    list-style: none; margin: 0; padding: 0; position: relative;
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--sp-4);
  }
  .tl::before {
    content: ""; position: absolute; left: 0; right: 0;
    top: calc(var(--tl-mark) / 2 - 1px); height: 2px; background: var(--rule);
  }
  .tl-item { position: relative; display: grid; gap: 0.3em; align-content: start; }
  .tl-mark { display: block; width: var(--tl-mark); height: var(--tl-mark); margin-bottom: 0.5em; }
  .tl-dot { fill: var(--surface); stroke: var(--mark); stroke-width: 3; }
  .tl-diamond { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .tl-when { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl-what { color: var(--quiet); }
  .tl-decision { display: grid; grid-template-columns: auto 1fr; gap: 0.4em; align-items: start; color: var(--accent); font-weight: 600; }
  .tl-decision .ico { margin-top: 0.1em; }

  /* Meter */
  .meter { display: grid; gap: 0.5em; }
  .meter-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3em 0.7em; }
  .meter-value { font-family: var(--font-display); font-weight: 750; font-size: calc(var(--big) * 0.55); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .meter-label { color: var(--quiet); }
  .meter-svg { display: block; width: 100%; height: 0.75em; }
  .meter-track { fill: var(--rule); }
  .meter-fill { fill: var(--accent); }

  /* Diagram */
  .diagram-svg svg { display: block; width: 100%; height: auto; }
  .diagram figcaption { margin-top: 0.6em; font-size: var(--fs-small); color: var(--quiet); }
  .no-diagram { display: flex; gap: 0.45em; align-items: center; margin: 0 0 0.6em; color: var(--quiet); font-size: var(--fs-small); }
  @media (prefers-color-scheme: dark) {
    /* Rendered diagrams carry their own light palette; give them paper. */
    .diagram-svg { background: #f4f6f8; border-radius: var(--radius); padding: 0.6em; }
  }
  @media print { .diagram-svg { background: none; padding: 0; } }

  /* Tables */
  .table-wrap { overflow-x: auto; min-width: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
  th, td { text-align: left; vertical-align: top; padding: 0.45em 0.65em 0.45em 0; border-bottom: 1px solid var(--rule); }
  th { color: var(--quiet); font-weight: 600; }
  td.num-cell { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.num-cell .badge-est { margin-left: 0.4em; }

  /* Stories, definitions, questions */
  .stories { display: grid; gap: var(--sp-4); }
  .story { border-left: 3px solid var(--rule); padding-left: var(--sp-3); }
  .story-title { font-size: 1.05rem; margin: 0 0 0.3em; display: flex; flex-wrap: wrap; gap: 0.5em; align-items: baseline; }
  .story-prio { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .story-why { margin: 0 0 0.5em; color: var(--quiet); }
  .scenarios { margin: 0; padding-left: 1.2em; display: grid; gap: 0.4em; }
  .scenarios strong { font-weight: 650; }
  .defs { margin: 0; display: grid; grid-template-columns: minmax(8em, 30%) 1fr; gap: 0.5em var(--sp-3); }
  .defs dt { font-weight: 650; }
  .defs dd { margin: 0; }
  .q-group { font-size: 1em; margin: var(--sp-3) 0 0.4em; }
  .q-group:first-child { margin-top: 0; }
  .q-group.blocking { color: var(--bad-ink); }
  .q-owner { color: var(--quiet); }

  /* Notices and links in the page header */
  .notice { margin: 0; font-size: var(--fs-small); color: var(--quiet); }
  .notice.bad { color: var(--bad-ink); font-weight: 600; }
  .notice.draft { color: var(--gap-ink); }
  .meta { margin: 0; font-size: var(--fs-small); color: var(--quiet); }
  .links-box { font-size: var(--fs-small); display: flex; flex-wrap: wrap; gap: 0.2em 1em; }
  .links-title { color: var(--quiet); }
  .links { display: contents; }
  .links li { list-style: none; }
  .gaps-list h3 { font-size: 1em; margin: 0 0 0.5em; }
  .gaps-list ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.4em; }
  .gaps-list li { display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center; }
  .frameworks, .based-on, .sources, .notes { margin: 0; }
  .line-label { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  /* ---- End of shared styles ---- */

  /* ---- Board deck ---- */
  body { background: var(--canvas); }
  .deck-bar {
    max-width: 1280px; margin: 0 auto;
    padding: clamp(16px, 3vw, 32px) clamp(12px, 3vw, 40px) 0;
    display: grid; gap: 0.35em;
  }
  .deck-bar h1 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .deck-bar .idea-title { margin: 0; color: var(--quiet); }
  .deck-meta { display: flex; flex-wrap: wrap; gap: 0.3em 1.2em; align-items: baseline; }
  .deck {
    display: grid; justify-items: center;
    gap: clamp(16px, 3vw, 40px);
    padding: clamp(16px, 3vw, 32px) clamp(12px, 3vw, 40px) clamp(32px, 5vw, 64px);
  }
  html { scroll-snap-type: y proximity; }
  .frame { container: slide / inline-size; width: 100%; max-width: 1280px; scroll-snap-align: start; scroll-margin-top: 12px; }
  .slide {
    /* Frame-relative type scale, set from a 1280 x 720 design (1cqw = 12.8px
       there), with a floor so a phone stays readable; the slide then grows
       taller than 16:9 instead of clipping. */
    --pad-y: max(4cqw, 18px);
    --pad-x: max(5cqw, 18px);
    --fs-head: max(3.28cqw, 22px);
    --fs-sub: max(1.4cqw, 15px);
    --fs-body: max(1.3cqw, 14px);
    --fs-label: max(1.02cqw, 11px);
    --fs-small: max(0.94cqw, 11px);
    --fs-badge: max(0.94cqw, 10px);
    --big: max(8.1cqw, 48px);
    --tl-mark: max(1.45cqw, 14px);
    --r-card: max(0.94cqw, 8px);
    min-height: calc(100cqw * 9 / 16);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    gap: max(2.1cqw, 14px);
    padding: var(--pad-y) var(--pad-x) max(2.5cqw, 14px);
    background: var(--surface);
    border: 1px solid var(--rule); border-radius: var(--radius);
    font-size: var(--fs-body); line-height: 1.38;
  }
  .kicker { display: flex; flex-wrap: wrap; gap: 0.4em 0.8em; align-items: center; font-size: max(1.1cqw, 12px); color: var(--quiet); margin-bottom: max(0.8cqw, 6px); }
  .kicker .badge-est { margin-left: auto; }
  .kicker-n { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .slide-title {
    margin: 0; max-width: 40ch;
    font-family: var(--font-display); font-size: var(--fs-head); font-weight: 700;
    line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
  }
  .slide-message { margin: 0.4em 0 0; max-width: 70ch; font-size: var(--fs-sub); color: var(--quiet); line-height: 1.35; }
  .slide-gaps { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.8em; }
  .slide-body { display: grid; gap: max(4.4cqw, 18px); align-content: center; align-items: center; min-height: 0; }
  .slide-body.split { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .layout-ratio .slide-body.split, .layout-line .slide-body.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  .layout-compare .slide-body.split { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }
  .layout-meter .slide-body.split, .layout-tree .slide-body.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: max(5cqw, 18px); }
  .hero { min-width: 0; display: grid; gap: max(2.2cqw, 14px); align-content: center; }
  .hero-extra { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12em), 1fr)); gap: max(1.1cqw, 10px); align-items: stretch; }
  .hero-extra > .nums, .hero-extra > .nums > .tiles { display: grid; }
  .aside { --big: max(4.2cqw, 28px); min-width: 0; display: grid; gap: max(2cqw, 12px); align-content: center; }
  .layout-number .split > .aside { border-left: 1px solid var(--rule); padding-left: max(3.75cqw, 16px); }
  .slide-body:not(.split) > .aside { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: start; }
  .layout-text .hero .text { font-size: calc(var(--fs-sub) * 1.25); line-height: 1.3; max-width: 40ch; }
  .layout-list .hero .list-ico { font-size: var(--fs-sub); gap: 0.9em; }
  .hero-gap { display: flex; align-items: center; min-height: 6em; }
  .hero-gap .tag-gap { font-size: var(--fs-body); }
  .slide .chart-title { font-weight: 600; font-size: max(1.25cqw, 14px); }
  .slide .bars { row-gap: max(1.4cqw, 10px); }
  .slide .bar-fill { height: max(3.9cqw, 24px); border-radius: 0 8px 8px 0; }
  .slide .bar-value { font-family: var(--font-display); font-size: max(2cqw, 17px); }
  .slide .bar-label { font-size: max(1.33cqw, 14px); font-weight: 600; }
  .slide .cap { font-size: var(--fs-small); }

  /* Small caps labels */
  .block-label, .num-label, .callout-label, .j-lane, .g-axis-label {
    font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--quiet);
  }

  /* Footer: one line of sources, frameworks and notes, page number right */
  .slide-foot {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 0.4em 2em;
    border-top: 1px solid var(--rule); padding-top: max(0.94cqw, 8px);
    font-size: var(--fs-small); color: var(--quiet); line-height: 1.4;
  }
  .foot-lines { min-width: 0; }
  .foot-lines > p { display: inline; margin: 0; }
  .foot-lines > p + p::before { content: " · "; }
  .slide-foot .line-label { color: inherit; font-weight: 600; }
  .pageno { flex: none; font-variant-numeric: tabular-nums; }

  /* Hero number and metric tiles */
  .num-hero { display: grid; gap: max(0.8cqw, 6px); justify-items: start; }
  .num-hero .num-label { font-size: max(1.17cqw, 12px); }
  .num-hero .num-value {
    font-family: var(--font-display); font-size: var(--big); font-weight: 700;
    line-height: 0.95; letter-spacing: -0.04em; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .num-value .unit, .tile-value .unit, .ratio-value .unit, .cbar-value .unit, .ccard-value .unit { font-size: 0.55em; letter-spacing: -0.01em; }
  .slide .nums { gap: max(2.8cqw, 16px); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5em), 1fr)); gap: max(1.25cqw, 10px); }
  .tile {
    background: var(--tint); border-radius: var(--r-card);
    padding: max(1.4cqw, 12px) max(1.56cqw, 14px);
    display: grid; gap: 0.4em; align-content: start; justify-items: start;
  }
  .tile.is-hl { background: var(--accent-soft); }
  .tile-ico { width: max(2cqw, 22px); height: max(2cqw, 22px); color: var(--accent); }
  .tile-value { font-family: var(--font-display); font-weight: 700; font-size: max(2.8cqw, 24px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile.is-hl .tile-value { color: var(--accent); }
  .tile-caption { color: var(--quiet); font-size: max(1.1cqw, 12px); }
  .tile.is-hl .tile-caption { color: var(--ink-2); }

  /* Pictogram ratio */
  .ratio { margin: 0; display: grid; gap: max(2.2cqw, 14px); justify-items: start; }
  .ratio-svg { display: block; width: min(100%, 30cqw); height: auto; }
  .ratio-off { fill: var(--mark); }
  .ratio-on { fill: var(--accent); }
  .ratio-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3em 0.9em; }
  .ratio-value { font-family: var(--font-display); font-size: max(7.5cqw, 44px); font-weight: 700; line-height: 0.9; letter-spacing: -0.04em; color: var(--accent); }
  .ratio-label { font-size: max(1.4cqw, 15px); color: var(--ink-2); max-width: 11em; line-height: 1.35; }

  /* Callout */
  .callout {
    border-radius: var(--r-card); padding: max(1.25cqw, 12px) max(1.4cqw, 14px);
    display: flex; gap: max(1.1cqw, 10px); align-items: center; background: var(--tint);
  }
  .callout.is-risk { background: var(--risk-soft); }
  .callout.is-risk .callout-label, .callout.is-risk .callout-ico { color: var(--risk-ink); }
  .callout-ico { width: max(2.3cqw, 24px); height: max(2.3cqw, 24px); }
  .callout-body { display: grid; gap: 0.35em; min-width: 0; }
  .callout.has-ico .callout-body { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3em 1em; }
  .callout-text { font-weight: 600; font-size: max(1.33cqw, 14px); line-height: 1.3; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: max(0.8cqw, 8px); list-style: none; margin: 0; padding: 0; }
  .chip { display: inline-flex; align-items: center; gap: 0.55em; font-size: max(1.1cqw, 12px); color: var(--ink-2); background: var(--tint); border-radius: 999px; padding: 0.4em 1em; }
  .chip .ico { color: var(--quiet); }
  .chip-dot { width: 0.75em; height: 0.75em; border-radius: 50%; background: var(--mark); flex: none; }
  .chip-dot.is-above { background: var(--accent); }

  /* Compare as two bars */
  .cbars, .cbar-labels { display: flex; gap: max(2.8cqw, 16px); padding: 0 max(1cqw, 8px); }
  .cbars { align-items: flex-end; height: max(23cqw, 170px); border-bottom: 2px solid var(--rule); }
  .cbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: max(0.8cqw, 6px); height: 100%; width: max(9.4cqw, 72px); }
  .cbar-value { font-family: var(--font-display); font-weight: 700; font-size: max(3.1cqw, 24px); line-height: 1; color: var(--quiet); letter-spacing: -0.02em; }
  .cbar.is-emph .cbar-value { font-size: max(4cqw, 30px); color: var(--accent); }
  .cbar-bar { width: 100%; background: var(--mark); border-radius: 8px 8px 0 0; }
  .cbar.is-emph .cbar-bar { background: var(--accent); }
  .cbar-labels { margin-top: 0.7em; color: var(--quiet); }
  .cbar-labels > div { width: max(9.4cqw, 72px); text-align: center; }
  .cbar-labels > .is-emph { color: var(--ink); font-weight: 700; }

  /* Compare as card groups */
  .ccards { display: flex; gap: max(1.6cqw, 14px); align-items: center; }
  .cgroup { flex: 1 1 0; min-width: 0; display: grid; gap: max(1.25cqw, 10px); }
  .cgroup-head { display: flex; gap: 0.6em; align-items: baseline; }
  .cgroup-count { font-family: var(--font-display); font-weight: 700; font-size: max(3.4cqw, 28px); line-height: 1; color: var(--quiet); }
  .cgroup.is-emph .cgroup-count { color: var(--accent); }
  .cgroup-label { font-weight: 700; font-size: max(1.4cqw, 15px); color: var(--ink-2); }
  .cgroup.is-emph .cgroup-label { color: var(--ink); }
  .ccard-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: max(1.25cqw, 10px); }
  .ccard {
    min-height: max(16.4cqw, 120px); border-radius: max(1.25cqw, 10px); padding: max(1.7cqw, 14px);
    display: flex; flex-direction: column; justify-content: space-between; gap: 1em;
    border: 2px dashed var(--mark); color: var(--ink-2);
  }
  .cgroup.is-emph .ccard { background: var(--accent); border: 0; color: var(--on-accent); }
  .ccard-ico { width: max(3.1cqw, 28px); height: max(3.1cqw, 28px); color: var(--quiet); }
  .cgroup.is-emph .ccard-ico { color: var(--on-accent); }
  .ccard-body { display: grid; gap: 0.3em; }
  .ccard-value { display: block; font-family: var(--font-display); font-weight: 700; font-size: max(2.65cqw, 22px); line-height: 1; }
  .ccard-text { font-weight: 700; font-size: max(1.4cqw, 15px); line-height: 1.25; }
  .cgroup.is-emph .badge-est { color: inherit; border-color: currentColor; }
  .ccards > .compare-arrow { flex: none; color: var(--mark); width: max(4cqw, 28px); height: max(4cqw, 28px); }

  /* Options as rows */
  .opt-rows { display: grid; gap: max(0.8cqw, 8px); }
  .opt-row {
    display: grid; grid-template-columns: minmax(9em, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: max(1.9cqw, 12px); align-items: center;
    padding: max(1.4cqw, 12px) max(1.56cqw, 14px);
    border: 1px solid var(--rule); border-radius: var(--r-card);
  }
  .opt-rows.has-measure .opt-row { grid-template-columns: minmax(9em, 1.1fr) minmax(0, 2fr) minmax(0, 1.25fr) minmax(0, 1.25fr); }
  .opt-row.opt-head {
    border: 0; padding-top: 0; padding-bottom: 0;
    font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet);
  }
  .opt-row.is-chosen { border: 2px solid var(--accent); background: var(--accent-soft); }
  .opt-namecell { display: grid; gap: 0.2em; justify-items: start; }
  .opt-row .opt-name { font-size: max(1.48cqw, 15px); font-weight: 700; }
  .opt-row .opt-summary { font-size: var(--fs-small); }
  .opt-measure { display: grid; gap: 0.35em; align-items: center; justify-items: start; }
  .opt-track { position: relative; width: 100%; height: max(1.1cqw, 10px); border-radius: 999px; background: var(--tint); }
  .opt-row.is-chosen .opt-track { background: var(--surface); }
  .opt-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: max(1.1cqw, 10px); border-radius: 999px; background: var(--quiet); }
  .opt-row.is-chosen .opt-fill { background: var(--accent); }
  .opt-fill-hi { position: absolute; top: 0; bottom: 0; border-radius: 0 999px 999px 0; background: repeating-linear-gradient(45deg, var(--mark) 0 6px, transparent 6px 12px); }
  .opt-measure-label { font-weight: 700; font-size: max(1.17cqw, 13px); color: var(--ink-2); }
  .opt-row.is-chosen .opt-measure-label { color: var(--accent); }
  .opt-row .opt-line { display: flex; gap: 0.5em; align-items: center; }
  .opt-row .opt-con { color: var(--ink-2); }
  .opt-row .opt-con .ico { color: var(--risk-ink); }
  .opt-row .opt-line .ico { margin-top: 0; }

  /* Vertical steps */
  .steps-wrap { margin: 0; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: max(1.7cqw, 12px); position: relative; }
  .steps::before { content: ""; position: absolute; left: calc(var(--tl-mark) / 2 - 1px); top: 0.6em; bottom: 0.6em; width: 2px; background: var(--rule); }
  .step { position: relative; display: grid; grid-template-columns: var(--tl-mark) minmax(0, 1fr); column-gap: max(1.1cqw, 10px); align-items: start; }
  .step > .tl-mark { grid-row: 1 / span 3; margin: 0.15em 0 0; }
  .step > :not(.tl-mark) { grid-column: 2; }
  .step-when { font-weight: 700; }
  .step-what { color: var(--quiet); }
  .tl-dot.is-first { fill: var(--accent); stroke: var(--accent); }

  /* Deadline */
  .deadline { display: flex; gap: max(1.4cqw, 12px); align-items: center; }
  .cal { flex: none; width: max(7.2cqw, 64px); border: 2px solid var(--ink); border-radius: var(--r-card); overflow: hidden; text-align: center; }
  .cal-head { background: var(--ink); color: var(--surface); font-size: max(1cqw, 11px); font-weight: 600; padding: 0.3em 0; }
  .cal-day { font-family: var(--font-display); font-size: max(3.4cqw, 28px); font-weight: 700; line-height: 1.6; }
  .deadline-body { display: grid; gap: 0.2em; }
  .deadline-label { font-size: max(1.56cqw, 16px); font-weight: 700; }
  .deadline-note { color: var(--quiet); }

  /* KPI tree */
  .tree { --tl-gap: max(1.4cqw, 10px); --tl-len: max(2.8cqw, 18px); margin: 0; display: grid; }
  .tree .chart-title { margin-bottom: max(2cqw, 12px); }
  .tree-root {
    position: relative; justify-self: center; min-width: 44%;
    padding: max(1.4cqw, 12px) max(2cqw, 16px); margin-bottom: var(--tl-len);
    border-radius: var(--r-card); background: var(--ink); color: var(--surface);
    font-weight: 700; font-size: max(1.33cqw, 14px); text-align: center;
  }
  .tree-root::after { content: ""; position: absolute; left: calc(50% - 1px); top: 100%; height: calc(var(--tl-len) / 2); border-left: 2px solid var(--mark); }
  .tree-kids { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--tl-gap); }
  .tree-node {
    position: relative; border-radius: var(--r-card); border: 1px solid var(--rule); background: var(--tint);
    padding: max(1.1cqw, 10px) max(1.25cqw, 12px); display: grid; gap: 0.35em; align-content: start;
  }
  .tree-node::before { content: ""; position: absolute; left: calc(50% - 1px); top: calc(var(--tl-len) / -2 - 1px); height: calc(var(--tl-len) / 2); border-left: 2px solid var(--mark); }
  .tree-node::after { content: ""; position: absolute; top: calc(var(--tl-len) / -2 - 1px); left: calc(var(--tl-gap) / -2); right: calc(var(--tl-gap) / -2); border-top: 2px solid var(--mark); }
  .tree-node:first-child::after { left: 50%; }
  .tree-node:last-child::after { right: 50%; }
  .tree-node:only-child::after { display: none; }
  .tree-node.is-hl { border: 2px solid var(--accent); background: var(--accent-soft); }
  .tree-node.is-hl::before { border-left-color: var(--accent); }
  .tree-label { font-weight: 600; font-size: max(1.1cqw, 12px); }
  .tree-value { color: var(--quiet); font-weight: 600; font-size: max(1.33cqw, 14px); }
  .tree-value.is-fig { font-family: var(--font-display); font-weight: 700; font-size: max(2cqw, 18px); color: var(--ink); }
  .tree-node.is-hl .tree-value.is-fig { color: var(--accent); }

  /* Journey: lanes across ordered steps */
  .journey {
    --j-label: max(9.4cqw, 72px); --j-arrow: max(4.4cqw, 28px);
    margin: 0; display: grid; grid-template-columns: var(--j-cols, var(--j-label) repeat(3, minmax(0, 1fr)));
    gap: max(1.25cqw, 12px) max(0.94cqw, 8px); align-items: stretch;
  }
  .j-step { justify-self: start; align-self: center; font-size: max(1.1cqw, 12px); font-weight: 700; color: var(--surface); background: var(--ink); border-radius: 999px; padding: 0.35em 1em; }
  .j-step.is-hl { background: var(--accent); color: var(--on-accent); }
  .j-lane { align-self: center; font-size: max(1.17cqw, 12px); }
  .j-lane.is-emph { color: var(--accent); }
  .j-arrow { align-self: center; justify-self: center; color: var(--mark); }
  .j-arrow.is-emph { color: var(--accent); }
  .j-arrow .ico { width: max(3cqw, 24px); height: max(3cqw, 24px); stroke-width: 2.2; }
  .j-cell {
    position: relative; min-height: max(8.6cqw, 64px); border-radius: max(1.1cqw, 10px); padding: max(1.56cqw, 14px);
    display: flex; gap: max(1.1cqw, 10px); align-items: center;
    background: var(--tint); color: var(--ink-2); font-weight: 600; font-size: max(1.33cqw, 14px); line-height: 1.3;
  }
  .j-cell.is-empty { background: none; border: 2px dashed var(--mark); }
  .j-cell.is-emph { background: var(--accent-soft); color: var(--ink); }
  .j-cell.is-hl { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .j-ico { flex: none; width: max(4cqw, 36px); height: max(4cqw, 36px); border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--quiet); }
  .j-ico .ico { width: 50%; height: 50%; }
  .j-cell.is-empty .j-ico { background: none; border: 2px dashed var(--mark); }
  .j-cell.is-emph .j-ico { background: var(--accent); color: var(--on-accent); }
  .j-cell.is-hl .j-ico { background: var(--surface); color: var(--accent); }
  .j-cell-step { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Gantt: week bars per lane, decision diamonds */
  .gantt-wrap { margin: 0; }
  .gantt {
    --span: 12;
    display: grid; grid-template-columns: minmax(7em, 14%) repeat(var(--span), minmax(0, 1fr));
    row-gap: max(1.4cqw, 10px); align-items: center;
  }
  .gantt > * { grid-column: var(--c1) / var(--c2); grid-row: var(--r1) / var(--r2); min-width: 0; }
  .g-tick { text-align: center; font-size: max(1cqw, 11px); color: var(--quiet); border-bottom: 1px solid var(--rule); padding-bottom: 0.4em; }
  .g-axis-label { padding-bottom: 0.4em; }
  .g-lane { display: grid; gap: 0.1em; padding-right: 0.8em; }
  .g-lane-n { font-family: var(--font-display); font-weight: 700; font-size: max(2cqw, 18px); line-height: 1; color: var(--quiet); }
  .g-lane.is-emph .g-lane-n { color: var(--accent); }
  .g-lane-label { font-weight: 600; font-size: max(1.1cqw, 12px); color: var(--ink-2); }
  .g-bar {
    min-height: max(4.4cqw, 40px); margin: 0 2px; border-radius: max(0.8cqw, 8px);
    padding: 0.4em max(1.25cqw, 10px); display: flex; flex-wrap: wrap; gap: 0.3em 0.9em; align-items: center;
    background: var(--tint); color: var(--ink-2); font-weight: 600; font-size: max(1.17cqw, 13px); line-height: 1.3;
  }
  .g-bar.in-emph { background: var(--accent-soft); color: var(--ink); }
  .g-bar.is-emph { background: var(--accent); color: var(--on-accent); }
  .g-bar .tag-gap { background: var(--surface); font-weight: 500; }
  .g-range { display: none; font-weight: 700; }
  .g-mark { justify-self: end; align-self: stretch; width: 0; margin-right: -1px; margin-bottom: calc(-1 * max(1.4cqw, 10px)); border-right: 2px dashed var(--ink); pointer-events: none; z-index: 1; }
  .g-dec { position: relative; display: grid; gap: 0.15em; justify-items: center; text-align: center; padding-top: max(2.2cqw, 18px); }
  .g-dec.at-end { justify-items: end; text-align: right; }
  .g-dec.at-start { justify-items: start; text-align: left; }
  .g-diamond { position: absolute; top: 0; width: max(1.56cqw, 14px); height: max(1.56cqw, 14px); transform: translate(-50%, -50%) rotate(45deg); background: var(--ink); }
  .g-dec.is-last .g-diamond { background: var(--accent); }
  .g-when { font-weight: 700; }
  .g-what { color: var(--quiet); font-size: max(1.1cqw, 12px); }
  .g-decision { color: var(--accent); font-weight: 700; }

  /* Gauge and donut */
  .gauge, .donut { margin: 0; display: grid; justify-items: center; gap: max(0.6cqw, 6px); }
  .gauge-svg { display: block; width: min(100%, 36cqw); height: auto; overflow: visible; }
  .gauge-svg text, .donut-svg text { font-family: var(--font-text); }
  .gauge-ok, .gauge-stop { fill: none; stroke-width: 34; }
  .gauge-ok { stroke: var(--accent); }
  .gauge-stop { stroke: var(--risk-line); }
  .gauge-tick { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
  .gauge-needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .gauge-th { fill: var(--ink); font-weight: 700; }
  .gauge-end { fill: var(--quiet); }
  .gauge-zone-ok { fill: var(--accent); font-weight: 700; }
  .gauge-zone-stop { fill: var(--risk-ink); font-weight: 700; }
  .gauge-big, .donut-value { fill: var(--ink); font-family: var(--font-display); font-weight: 700; }
  .gauge-note { fill: var(--ink-2); }
  .gauge-label { color: var(--quiet); }
  .donut-svg { display: block; width: min(100%, 17cqw); height: auto; }
  .donut-track { fill: none; stroke: var(--rule); stroke-width: 26; }
  .donut-arc { fill: none; stroke: var(--accent); stroke-width: 26; }
  .donut-label { fill: var(--quiet); }

  /* Control cards */
  .controls { display: grid; gap: max(1.1cqw, 10px); }
  .control { display: flex; gap: max(1.4cqw, 12px); align-items: center; background: var(--tint); border-radius: max(1.1cqw, 10px); padding: max(1.4cqw, 12px) max(1.56cqw, 14px); }
  .control.is-stop { background: var(--risk-soft); }
  .control-mark {
    flex: none; width: max(4.4cqw, 40px); height: max(4.4cqw, 40px); border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
    font-family: var(--font-display); font-weight: 700; font-size: max(1.9cqw, 18px);
  }
  .control.is-stop .control-mark { background: var(--risk-ink); color: var(--surface); }
  .control-mark .ico { width: 50%; height: 50%; }
  .control-body { display: grid; gap: 0.1em; }
  .control-text { font-weight: 700; font-size: max(1.56cqw, 16px); line-height: 1.25; }
  .control-note { color: var(--quiet); font-size: max(1.1cqw, 12px); }

  /* Appendix: status, assumptions, questions */
  .layout-appendix .slide-body { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr) minmax(0, 1fr); gap: max(2.8cqw, 16px); align-content: center; align-items: center; }
  .app-col { display: grid; gap: max(1.1cqw, 10px); align-content: start; min-width: 0; }
  .app-status { justify-items: center; gap: max(1.4cqw, 12px); }
  .cards { display: grid; gap: max(1.1cqw, 10px); }
  .card { border-radius: max(1.1cqw, 10px); background: var(--tint); padding: max(1.4cqw, 12px) max(1.56cqw, 14px); display: grid; gap: 0.6em; }
  .card-head { display: flex; gap: 0.6em; align-items: center; }
  .card.is-q .card-head { justify-content: space-between; }
  .card-id { font-size: var(--fs-label); font-weight: 700; color: var(--quiet); font-variant-numeric: tabular-nums; }
  .card-head .ico { color: var(--accent); }
  .card-text { font-weight: 600; font-size: max(1.33cqw, 14px); line-height: 1.3; }
  .card.is-q { background: none; border: 1px solid var(--rule); }
  .card.is-blocking { border: 2px solid var(--bad-ink); }
  .pill-block { font-size: var(--fs-badge); font-weight: 700; color: var(--surface); background: var(--bad-ink); border-radius: 999px; padding: 0.2em 0.8em; white-space: nowrap; }
  .card-owner { display: flex; gap: 0.5em; align-items: center; color: var(--ink-2); font-size: max(1.1cqw, 12px); }
  .card-owner .ico { color: var(--quiet); }
  .gap-chips { display: grid; gap: 0.45em; justify-items: center; text-align: center; }

  /* Trace page */
  .layout-trace .slide-body { align-content: start; align-items: stretch; gap: max(1.1cqw, 10px); }
  .layout-trace .slide-body > * { min-width: 0; }
  .kind-bar { display: flex; min-height: max(3.1cqw, 30px); border-radius: 8px; overflow: hidden; }
  .kind-seg { display: flex; align-items: center; padding: 0 max(1.1cqw, 10px); font-weight: 700; font-size: max(1.17cqw, 12px); white-space: nowrap; min-width: 0; overflow: hidden; }
  .kind-seg.is-measured { background: var(--accent); color: var(--on-accent); }
  .kind-seg.is-assumed { background: var(--mark); color: var(--ink); }
  .kind-seg.is-estimate { background: repeating-linear-gradient(45deg, var(--mark) 0 6px, var(--tint) 6px 12px); color: var(--ink); }
  .kind-seg.is-unknown { border: 1px dashed var(--bad-ink); color: var(--bad-ink); }
  .kind-note { display: flex; justify-content: flex-end; margin-top: -0.4em; }
  .trace-matrix { font-size: max(1.1cqw, 12px); }
  .trace-matrix th, .trace-matrix td { border: 0; padding: 0.12em 0.2em; text-align: center; vertical-align: middle; line-height: 1.3; }
  .trace-matrix thead th { color: var(--quiet); font-weight: 700; }
  .trace-matrix th[scope="row"], .trace-matrix .corner { text-align: left; padding-right: 1em; width: 30%; }
  .trace-matrix th[scope="row"] { font-weight: 600; color: var(--ink); }
  .dot { display: inline-block; width: max(1.4cqw, 14px); height: max(1.4cqw, 14px); border-radius: 50%; vertical-align: middle; }
  .dot.is-none { width: max(0.8cqw, 8px); height: max(0.8cqw, 8px); background: var(--rule); }
  .dot.is-measured { background: var(--accent); }
  .dot.is-assumed { background: var(--quiet); }
  .dot.is-estimate { border: 3px solid var(--quiet); }
  .dot.is-unknown { border: 2px dashed var(--bad-ink); }
  .trace-legend { display: flex; flex-wrap: wrap; gap: 0.4em 1.6em; align-items: center; color: var(--quiet); font-size: var(--fs-small); }
  .trace-legend > span { display: inline-flex; gap: 0.5em; align-items: center; }
  .trace-based { margin: 0.3em 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.1em 2em; font-size: var(--fs-small); color: var(--quiet); }
  .trace-based > div { display: flex; gap: 0.5em; }
  .trace-based dt { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .trace-based dd { margin: 0; }

  .deck-foot { max-width: 1280px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 40px) 32px; font-size: var(--fs-small); color: var(--quiet); }

  /* Phone and narrow windows: one column, the slide grows taller */
  @container slide (max-width: 680px) {
    .slide-body.split, .layout-appendix .slide-body { grid-template-columns: minmax(0, 1fr); }
    .layout-number .split > .aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 14px; }
    .slide-body:not(.split) > .aside { grid-auto-flow: row; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    .compare-arrow { transform: rotate(90deg); }
    .ccards { flex-direction: column; align-items: stretch; }
    .ccards > .compare-arrow { align-self: center; }
    .ccard-grid { grid-auto-flow: row; }
    .ccard { min-height: 0; }
    .opt-row, .opt-rows.has-measure .opt-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .opt-row.opt-head { display: none; }
    .tl { grid-auto-flow: row; gap: 14px; }
    .tl::before { left: calc(var(--tl-mark) / 2 - 1px); right: auto; top: 0; bottom: 0; width: 2px; height: auto; }
    .tl-item { grid-template-columns: var(--tl-mark) minmax(0, 1fr); column-gap: 0.8em; }
    .tl-item > .tl-mark { grid-row: 1 / span 3; margin: 0; }
    .tl-item > :not(.tl-mark) { grid-column: 2; }
    .tree-kids { grid-auto-flow: row; }
    .tree-root { margin-bottom: 14px; }
    .tree-root::after, .tree-node::before, .tree-node::after { display: none; }
    .journey { grid-template-columns: minmax(0, 1fr); }
    .j-corner, .j-step, .j-gap { display: none; }
    .j-arrow { justify-self: start; margin-left: 12px; transform: rotate(90deg); }
    .j-lane { margin-top: 8px; }
    .j-cell { flex-wrap: wrap; }
    .j-cell-step { position: static; width: auto; height: auto; overflow: visible; clip-path: none; flex-basis: 100%; font-size: var(--fs-small); font-weight: 700; }
    .gantt { grid-template-columns: minmax(0, 1fr); }
    .gantt > * { grid-column: 1 / -1; grid-row: auto; }
    .g-tick, .g-axis-label, .g-mark { display: none; }
    .g-range { display: inline; }
    .g-dec, .g-dec.at-end, .g-dec.at-start { justify-items: start; text-align: left; padding: 0 0 0 26px; }
    .g-diamond { top: 0.75em; left: 8px !important; }
    .layout-trace .table-wrap { overflow-x: auto; }
    .trace-based { grid-template-columns: minmax(0, 1fr); }
    .slide-foot { flex-direction: column; align-items: flex-start; }
  }
  @media print {
    @page { size: 338.67mm 190.5mm; margin: 0; }
    html { scroll-snap-type: none; }
    body { background: #ffffff; }
    .deck-bar, .deck-foot { display: none; }
    .deck { display: block; padding: 0; }
    .frame { width: 338.67mm; max-width: none; break-after: page; page-break-after: always; break-inside: avoid; page-break-inside: avoid; }
    .frame:last-child { break-after: auto; page-break-after: auto; }
    .slide { min-height: 190.5mm; border: 0; border-radius: 0; }
    .frame:has(.layout-trace), .frame:has(.layout-appendix) { break-inside: auto; page-break-inside: auto; }
  }
</style>

      var pb = figParts(b, short);

  // A figure as a display value: the number, then the unit in a smaller span.

    var p = figParts(f, short);
    var node = el("span", cls, p.num);

    node.setAttribute("data-figure", id);
    return node;
  }

  // Two figures as one range ("18→24%").

    var a = useFig(ctx, id);
    var b = useFig(ctx, toId);

    var node = el("span", cls, rangeText(a, b, short));

    return node;

  // slide, into the footer source line (the slide footer already lists the
  // source, period and kind of every figure shown).
  function sourceNote(source, figs, ctx) {

    });
    extra.forEach(function (src, i) {

      p.appendChild(document.createTextNode(src));

    return p;
  }

  // Source and period under every chart.

    var src = str(source);

    if (src) cap.appendChild(document.createTextNode(t("source") + ": " + src));

    var periods = [];
    figs.forEach(function (f) { if (f && f.period && periods.indexOf(str(f.period)) < 0) periods.push(str(f.period)); });
    if (periods.length) cap.appendChild(document.createTextNode("; " + t("periodLower") + ": " + periods.join(", ")));
    return cap;

  function figureTable(ids) {
    var wrap = el("div", "table-wrap");
    var tbl = el("table", "figures-table");
    var head = el("tr");
    [t("colId"), t("colValue"), t("source"), t("period"), t("colKind")].forEach(function (c) { head.appendChild(el("th", null, c)); });
    var thead = el("thead");
    thead.appendChild(head);
    tbl.appendChild(thead);

  // ---- Inline SVG ----

  function table(columns, rows, ctx) {
    var wrap = el("div", "table-wrap");
    var tbl = el("table");
    var cols = arr(columns);
    if (cols.length) {
      var thead = el("thead");
      var tr = el("tr");
      cols.forEach(function (c) { tr.appendChild(el("th", null, str(c))); });
      thead.appendChild(tr);
      tbl.appendChild(thead);
    }
    var tbody = el("tbody");
    arr(rows).forEach(function (row) {
      var r = el("tr");
      arr(row).forEach(function (cell) {
        var td = el("td");
        td.appendChild(richText(cell, ctx));
        r.appendChild(td);
      });
      tbody.appendChild(r);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    return wrap;
  }

  function diagramSlot(id, ctx) {
    if (!id) return null;
    var d = hasOwn.call(DIAG, id) ? DIAG[id] : null;
    var fig = el("figure", "diagram");
    var svg = d ? sanitizeSvg(d.svg) : null;
    if (svg) {
      svg.setAttribute("role", "img");
      if (d.message) svg.setAttribute("aria-label", str(d.message));
      var paper = el("div", "diagram-svg");
      paper.appendChild(svg);
      fig.appendChild(paper);
      if (d.message) fig.appendChild(el("figcaption", null, str(d.message)));
      return fig;
    }
    fig.className = "diagram none";
    var note = el("p", "no-diagram");
    note.appendChild(icon("chart"));
    note.appendChild(document.createTextNode(t("noDiagram")));
    fig.appendChild(note);
    if (d && d.fallback && isObj(d.fallback)) fig.appendChild(table(d.fallback.columns, d.fallback.rows, ctx));
    if (d && d.message) fig.appendChild(el("figcaption", null, str(d.message)));

  // ---- Blocks (board slides and tech sections share them) ----
  // ctx.role: "hero" (the slide's main element), "aside" (supporting blocks
  // on a slide), "cards" (appendix lists and questions as cards), "doc" (tech

  // (headline text). ctx.sources collects block sources for the slide

  }

  function blockTitle(b, cls) { return b.title ? el("div", cls || "chart-title", str(b.title)) : null; }

  // Tech document: a figure tile (value, caption).
  function numTile(it, ctx, size) {
    var f = useFig(ctx, str(it.ref));
    var tile = el("div", "num num-" + size);
    if (it.icon && size !== "hero") tile.appendChild(icon(str(it.icon), "num-ico"));
    var body = el("div", "num-body");
    var v = el("div", "num-value");
    if (f) {
      var to = it.to_ref ? useFig(ctx, str(it.to_ref)) : null;
      var txt = to ? rangeText(f, to, false) : formatValue(f);
      v.textContent = txt;
      if (txt.length > 9) v.className += " is-long";
      v.setAttribute("data-figure", str(it.ref));
      if (it.to_ref && !to) body.appendChild(el("span", "missing", t("missingFigure", { id: str(it.to_ref) })));
    } else {
      v.className += " missing";
      v.textContent = t("missingFigure", { id: str(it.ref) });
    }
    body.insertBefore(v, body.firstChild);
    if (it.caption) { var c = el("div", "num-caption"); c.appendChild(richText(it.caption, ctx)); body.appendChild(c); }
    if (itemEstimate(it)) body.appendChild(estimateBadge());
    tile.appendChild(body);
    return tile;
  }

  // Slides: the hero number, label above, unit smaller.
  function heroNumber(it, ctx) {
    var box = el("div", "num-hero");
    if (it.caption) { var c = el("div", "num-label"); c.appendChild(richText(it.caption, ctx)); box.appendChild(c); }
    box.appendChild(itemValue(it, ctx, "num-value", true));
    if (itemEstimate(it)) box.appendChild(estimateBadge());
    return box;
  }

  // Slides: a metric tile with an optional icon.
  function metricTile(it, ctx) {
    var box = el("div", "tile" + (it.highlight === true ? " is-hl" : ""));
    if (it.icon) box.appendChild(icon(str(it.icon), "tile-ico"));
    box.appendChild(itemValue(it, ctx, "tile-value", true));
    if (it.caption) { var c = el("div", "tile-caption"); c.appendChild(richText(it.caption, ctx)); box.appendChild(c); }
    if (itemEstimate(it)) box.appendChild(estimateBadge());
    return box;
  }

  // target: { ref, label } on a chart: a reference line (a goal, a cost).
  function targetOf(b, ctx) {

  }

  function barChart(b, ctx) {

    var items = figItems(b);
    var tg = targetOf(b, ctx);
    var tv = tg && isNum(tg.f) ? tg.f.value : null;
    var max = tv !== null && tv > 0 ? tv : 0;
    items.forEach(function (it) {
      var f = figOf(str(it.ref));
      if (isNum(f) && f.value > max) max = f.value;
    });
    var scale = max > 0 ? max * 1.25 : 0; // room for the value after the longest bar
    var anyHl = items.some(function (it) { return it.highlight === true; });
    var box = el("div", "bars" + (tg ? " has-target" : ""));
    var figs = [];
    var above = 0;
    var below = 0;
    items.forEach(function (it, i) {
      var f = useFig(ctx, str(it.ref));
      figs.push(f);
      var v = isNum(f) ? f.value : null;
      var cls = "";
      if (!anyHl || it.highlight === true) cls += " bar-row-hl";
      if (tv !== null && v !== null) {
        if (v >= tv) { cls += " bar-row-above"; above++; } else { cls += " bar-row-below"; below++; }
      }

      label.style.gridColumn = "1";

      }
      track.appendChild(val);
      box.appendChild(label);
      box.appendChild(track);
    });
    if (tg) {
      figs.push(tg.f);

      zone.style.gridRow = "1 / span " + Math.max(1, items.length);
      var line = el("div", "bar-target-line");

  function lineChart(b, ctx) {
    var fig = el("figure", "chart");
    addNote(fig, blockTitle(b));
    var items = figItems(b);
    var tg = targetOf(b, ctx);
    var tv = tg && isNum(tg.f) ? tg.f.value : null;
    var pts = [];
    var figs = [];
    var missing = [];
    items.forEach(function (it) {
      var f = useFig(ctx, str(it.ref));
      figs.push(f);
      if (isNum(f)) pts.push({ f: f, label: str(it.caption || it.ref) });

    var ink = tg ? " is-ink" : "";

        dl.appendChild(el("dt", null, str(it.term)));
        var dd = el("dd");
        if (it.meaning) dd.appendChild(richText(it.meaning, ctx));
        else dd.appendChild(gapBadge());
        dl.appendChild(dd);
      });
      return dl;
    },
    questions: function (b, ctx) {
      if (ctx.role === "cards") return questionCards(b, ctx);
      var box = el("div", "questions");
      [[true, "blocking"], [false, "nonBlocking"]].forEach(function (group) {
        var items = arr(b.items).filter(function (q) { return isObj(q) && (q.blocking === true) === group[0]; });
        box.appendChild(el("h3", "q-group" + (group[0] ? " blocking" : ""), t(group[1])));
        if (!items.length) { box.appendChild(el("p", "muted", t("noneBlocking"))); return; }
        var ul = el("ul", "list");
        items.forEach(function (q) {
          var li = el("li");
          if (q.id) li.appendChild(el("span", "item-id", str(q.id)));
          li.appendChild(richText(q.text, ctx));
          if (q.owner) li.appendChild(el("span", "q-owner", " (" + t("owner") + ": " + str(q.owner) + ")"));
          ul.appendChild(li);
        });
        box.appendChild(ul);
      });
      return box;
    },
    gap: function (b) {
      var p = el("p", "gap-line");
      p.appendChild(gapBadge(str(b.field)));
      return p;
    }
  };

  function validBlocks(blocks) {
    return arr(blocks).filter(function (b) { return isObj(b) && hasOwn.call(BLOCKS, b.type); });
  }

  function renderBlocks(blocks, ctx) {
    var frag = document.createDocumentFragment();
    validBlocks(blocks).forEach(function (b) {
      var node = BLOCKS[b.type](b, ctx);
      if (node) frag.appendChild(node);
    });
    return frag;
  }

  function frameworksLine(list, short) {
    var items = arr(list).map(function (fw) {
      return typeof fw === "string" ? { name: fw } : (isObj(fw) ? fw : null);
    }).filter(function (fw) { return fw && (fw.name || fw.id); });
    if (!items.length) return null;
    var p = el("p", "frameworks");
    p.appendChild(el("span", "line-label", t(short ? "frameworksShort" : "frameworks") + ": "));
    items.forEach(function (fw, i) {
      if (i) p.appendChild(document.createTextNode("; "));
      p.appendChild(document.createTextNode(str(fw.name || fw.id)));
      if (fw.result) p.appendChild(document.createTextNode(" (" + str(fw.result) + ")"));
    });
    return p;
  }

  function basedOn(fields) {
    var list = arr(fields).map(str).filter(Boolean);
    if (!list.length) return null;
    var p = el("p", "based-on");
    p.appendChild(el("span", "line-label", t("basedOn") + ": "));
    p.appendChild(document.createTextNode(list.join(", ")));
    return p;
  }

  function headerMeta(target) {
    if (readError) { target.appendChild(el("p", "notice bad", t("readError"))); return; }
    if (idea.version) target.appendChild(el("p", "meta", t("version", { date: formatDate(str(idea.version)) })));
    if (idea.draft === true) target.appendChild(el("p", "notice draft", t("draft")));
    var est = el("p", "notice");
    if (estimatePending) { est.appendChild(estimateBadge()); est.appendChild(document.createTextNode(" ")); }
    est.appendChild(document.createTextNode(estimatePending ? t("estimatePending") : t("estimateDone")));
    target.appendChild(est);
    var links = isObj(data.links) ? data.links : {};
    var ul = el("ul", "links");
    ["board_artifact", "tech_artifact", "slides", "docs"].forEach(function (key) {
      var href = links[key];
      if (typeof href === "string" && /^https:/i.test(href) && safeHref(href)) {
        var li = el("li");
        li.appendChild(link(t("link_" + key), href));
        ul.appendChild(li);
      }
    });
    if (ul.childNodes.length) {
      var wrap = el("div", "links-box");
      wrap.appendChild(el("span", "links-title", t("links") + ":"));
      wrap.appendChild(ul);
      target.appendChild(wrap);
    }
  }

  function gapsList() {
    var box = el("div", "gaps-list");
    box.appendChild(el("h3", null, t("gapsTitle")));
    if (!GAPS.length) { box.appendChild(el("p", "muted", t("noGaps"))); return box; }
    var ul = el("ul");
    GAPS.forEach(function (g) {
      var li = el("li");
      li.appendChild(gapBadge());
      li.appendChild(el("span", null, gapText(g.field)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }
  // ---- End of shared renderer ----
  // ---- Board deck ----
  var PLAIN_GAPS = true;
  var SLIDE_MAP = [
    { n: 1, label: "slide1" }, { n: 2, label: "slide2" }, { n: 3, label: "slide3" },
    { n: 4, label: "slide4" }, { n: 5, label: "slide5" }, { n: 6, label: "slide6" },
    { n: 7, label: "slide7" }, { n: 8, label: "slide8" }, { n: 9, label: "slide9" },
    { n: "appendix", label: "slideAppendix" }
  ];
  // Message plus text, list and callout blocks; beyond this they go to the footer notes.
  var WORD_LIMIT = 30;

  // Layout hint -> the block type that becomes the hero.
  var LAYOUT_BLOCK = {
    number: "figures", bars: "chart", line: "chart", ratio: "ratio", compare: "compare",
    options: "options", timeline: "timeline", meter: "meter", tree: "tree", journey: "journey",
    table: "table", list: "list"
  };
  var AUTO_ORDER = ["journey", "compare", "options", "timeline", "chart", "ratio", "figures", "meter", "tree", "table", "controls", "list"];
  var TYPE_LAYOUT = {
    journey: "journey", compare: "compare", options: "options", timeline: "timeline", ratio: "ratio",
    figures: "number", meter: "meter", tree: "tree", table: "table", controls: "list", list: "list"
  };
  // Layouts with a side column; the others stack the hero above the supporting blocks.
  var SPLIT = { number: 1, bars: 1, line: 1, ratio: 1, compare: 1, meter: 1, tree: 1, diagram: 1, text: 1 };
  // Blocks that count toward the word limit.
  var WORDY = { text: 1, list: 1, callout: 1 };

  function chartLayout(b) { return b.kind === "line" ? "line" : "bars"; }
  function hasSvg(id) { var d = hasOwn.call(DIAG, id) ? DIAG[id] : null; return !!(d && typeof d.svg === "string" && d.svg); }

  function pickLayout(s, blocks) {
    var hint = str(s.layout);
    var i;
    if (hint === "diagram" && s.diagram) return { layout: "diagram", hero: -1 };
    if (hasOwn.call(LAYOUT_BLOCK, hint)) {
      for (i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        if (b.type === LAYOUT_BLOCK[hint] && (b.type !== "chart" || chartLayout(b) === hint)) return { layout: hint, hero: i };
      }
    }
    if (s.diagram && hasSvg(s.diagram)) return { layout: "diagram", hero: -1 };
    for (var k = 0; k < AUTO_ORDER.length; k++) {
      for (i = 0; i < blocks.length; i++) {
        if (blocks[i].type === AUTO_ORDER[k]) {
          return { layout: AUTO_ORDER[k] === "chart" ? chartLayout(blocks[i]) : TYPE_LAYOUT[AUTO_ORDER[k]], hero: i };
        }
      }
    }
    if (s.diagram) return { layout: "diagram", hero: -1 };
    return { layout: "text", hero: blocks.length ? 0 : -1 };
  }

  var board = isObj(data.board) ? data.board : {};
  var byN = {};
  arr(board.slides).forEach(function (s) {
    if (!isObj(s)) return;
    var key = s.n === 10 ? "appendix" : String(s.n);
    if (!hasOwn.call(byN, key)) byN[key] = s;
  });

  document.getElementById("idea-title").textContent = str(idea.title);
  if (idea.title) document.title = "vibebiz · " + str(idea.title);
  headerMeta(document.getElementById("deck-meta"));

  var deck = document.getElementById("slides");
  var total = SLIDE_MAP.length + 1;
  var slideRefs = {};

  function slideShell(kickerN, kickerLabel, index) {
    var frame = el("div", "frame");
    var sec = el("section", "slide");
    var head = el("header", "slide-head");
    var kicker = el("div", "kicker");
    kicker.appendChild(el("span", "kicker-n", kickerN));
    kicker.appendChild(el("span", null, kickerLabel));
    if (idea.draft === true) kicker.appendChild(el("span", "tag-gap", t("draftShort")));
    head.appendChild(kicker);
    sec.appendChild(head);
    var foot = el("footer", "slide-foot");
    var lines = el("div", "foot-lines");
    foot.appendChild(lines);
    foot.appendChild(el("span", "pageno", t("slideOf", { n: index + 1, total: total })));
    frame.appendChild(sec);
    return { frame: frame, sec: sec, head: head, foot: foot, lines: lines };
  }

  // Gap fields as chips (the appendix status column).
  function gapChips() {
    var box = el("div", "gap-chips");
    if (!GAPS.length) { box.appendChild(el("p", "muted", t("noGaps"))); return box; }
    box.appendChild(el("div", "block-label", t("gapsTitle")));
    GAPS.forEach(function (g) { box.appendChild(el("span", "tag-gap", gapText(g.field))); });
    return box;
  }

  SLIDE_MAP.forEach(function (slot, index) {
    var s = byN[String(slot.n)] || null;
    var isAppendix = slot.n === "appendix";
    var refs = [];
    var sources = [];
    var shownGaps = [];
    var C = function (role) { return { refs: refs, role: role, sources: sources, shownGaps: shownGaps }; };
    var shell = slideShell(isAppendix ? t("appendix") : String(slot.n), t(slot.label), index);
    shell.frame.setAttribute("id", "slide-" + slot.n);
    shell.sec.setAttribute("aria-label", t(slot.label));

    var h2 = el("h2", "slide-title");
    h2.appendChild(s && s.title ? richText(s.title, C("title")) : document.createTextNode(t(slot.label)));
    shell.head.appendChild(h2);
    if (s && s.message) { var msg = el("p", "slide-message"); msg.appendChild(richText(s.message, C("title"))); shell.head.appendChild(msg); }

    var blocks = s ? validBlocks(s.blocks) : [];
    var notes = [];
    var layout;
    var body;

    if (isAppendix) {
      // Three columns: how much is clarified and what is not, assumptions, open questions.
      layout = "appendix";
      var cols = [el("div", "app-col app-status"), el("div", "app-col"), el("div", "app-col")];
      blocks.forEach(function (b) {
        var col = b.type === "meter" ? 0 : (b.type === "questions" ? 2 : 1);
        var role = b.type === "list" || b.type === "questions" ? "cards" : "aside";
        cols[col].appendChild(BLOCKS[b.type](b, C(role)));
      });
      cols[0].appendChild(gapChips());
      if (s && s.diagram) cols[1].appendChild(diagramSlot(s.diagram, C("aside")));
      body = el("div", "slide-body");
      cols.forEach(function (c) { if (c.childNodes.length) body.appendChild(c); });
    } else {
      var hero = el("div", "hero");
      var extra = el("div", "hero-extra");
      var aside = el("div", "aside");
      var pick = pickLayout(s || {}, blocks);
      layout = pick.layout;
      var used = words(s && s.message);
      if (layout === "diagram") {
        hero.appendChild(diagramSlot(s.diagram, C("hero")));
      } else if (pick.hero >= 0) {
        var hb = blocks[pick.hero];
        hero.appendChild(BLOCKS[hb.type](hb, C("hero")));
        used += blockWords(hb);
      } else {
        var hg = el("div", "hero-gap");
        hg.appendChild(gapBadge());
        hero.appendChild(hg);
      }
      // Supporting blocks: beside the hero, or under it with place "hero"; a
      // chips list stays with the block before it.
      var last = extra;
      blocks.forEach(function (b, i) {
        if (i === pick.hero && layout !== "diagram") return;
        if (WORDY[b.type]) {
          var w = blockWords(b);
          if (used + w > WORD_LIMIT) { notes.push(b); return; }
          used += w;
        }
        var target = b.place === "hero" ? extra : (b.type === "list" && b.form === "chips" ? last : aside);
        target.appendChild(BLOCKS[b.type](b, C("aside")));
        last = target;
      });
      if (s && s.diagram && layout !== "diagram") aside.appendChild(diagramSlot(s.diagram, C("aside")));
      if (extra.childNodes.length) hero.appendChild(extra);
      var hasAside = aside.childNodes.length > 0;
      body = el("div", "slide-body" + (hasAside && SPLIT[layout] ? " split" : ""));
      body.appendChild(hero);
      if (hasAside) body.appendChild(aside);
    }

    shell.sec.className = "slide layout-" + layout;
    shell.sec.appendChild(body);

    // Gaps for this slide, except those a block already shows in place.
    var gaps = gapsFor("slide", slot.n).filter(function (g) { return shownGaps.indexOf(str(g.field)) < 0; });
    if (!blocks.length || gaps.length) {
      var gbox = el("div", "slide-gaps");
      if (!blocks.length && !gaps.length) gbox.appendChild(gapBadge());
      gaps.forEach(function (g) { gbox.appendChild(gapBadge(str(g.field))); });
      shell.head.appendChild(gbox);
    }

    // Footer: figure sources, frameworks with their result, then notes that did not fit.
    var src = sourcesLine({ refs: refs, sources: sources });
    if (src) shell.lines.appendChild(src);
    var fw = s ? frameworksLine(s.frameworks, true) : null;
    if (fw) shell.lines.appendChild(fw);
    if (notes.length) {
      var np = el("p", "notes");
      np.appendChild(el("span", "line-label", t("notes") + ": "));
      notes.forEach(function (b, i) {
        if (i) np.appendChild(document.createTextNode("; "));
        np.appendChild(richText(blockText(b), C("aside")));
      });
      shell.lines.appendChild(np);
    }
    slideRefs[String(slot.n)] = refs;
    shell.sec.appendChild(shell.foot);
    deck.appendChild(shell.frame);
  });

  // Trace page: the figures by kind, which slide uses which source, and the
  // fields each slide came from. Built from numbers[] and the slides' refs.
  (function () {
    var shell = slideShell(t("appendix"), t("traceTitle"), total - 1);
    shell.frame.setAttribute("id", "slide-trace");
    shell.sec.className = "slide layout-trace";
    shell.sec.setAttribute("aria-label", t("traceTitle"));
    shell.head.appendChild(el("h2", "slide-title", FIG_ORDER.length ? t("traceHeadlineCount", { n: FIG_ORDER.length }) : t("traceHeadline")));
    var body = el("div", "slide-body");

    function kindOf(f) {
      if (f.estimate === true) return "estimate";
      if (f.label === "measured") return "measured";
      if (f.label === "assumed") return "assumed";
      return "unknown";
    }
    var KINDS = [["measured", "kindMeasured"], ["assumed", "kindAssumed"], ["estimate", "kindEstimate"], ["unknown", "noLabel"]];
    var count = { measured: 0, assumed: 0, estimate: 0, unknown: 0 };
    FIG_ORDER.forEach(function (id) { count[kindOf(FIG[id])]++; });

    var top = el("div", "kind-wrap");
    var bar = el("div", "kind-bar");
    KINDS.forEach(function (k) {
      if (!count[k[0]]) return;
      var seg = el("div", "kind-seg is-" + k[0], count[k[0]] + " " + t(k[1]));
      seg.style.flexGrow = String(count[k[0]]);
      bar.appendChild(seg);
    });
    if (bar.childNodes.length) top.appendChild(bar);
    if (estimatePending && count.estimate) {
      var note = el("div", "kind-note");
      note.appendChild(el("span", "badge-est", t("estimatesPending", { n: count.estimate })));
      top.appendChild(note);
    }
    body.appendChild(top);

    // Source by slide matrix: a dot where the slide shows a figure from that source.
    var srcs = [];
    FIG_ORDER.forEach(function (id) { var s = str(FIG[id].source); if (srcs.indexOf(s) < 0) srcs.push(s); });
    if (srcs.length) {
      var wrap = el("div", "table-wrap");
      var tbl = el("table", "trace-matrix");
      var thead = el("thead");
      var hr = el("tr");
      hr.appendChild(el("th", "corner", t("traceCorner")));
      SLIDE_MAP.forEach(function (slot) {
        var th = el("th", null, slot.n === "appendix" ? t("appendixShort") : String(slot.n));
        th.setAttribute("scope", "col");
        th.setAttribute("title", t(slot.label));
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      tbl.appendChild(thead);
      var tbody = el("tbody");
      srcs.forEach(function (src) {
        var tr = el("tr");
        var th = src ? el("th", null, src) : el("th", "missing", t("noSource"));
        th.setAttribute("scope", "row");
        tr.appendChild(th);
        SLIDE_MAP.forEach(function (slot) {
          var ids = arr(slideRefs[String(slot.n)]).filter(function (id) { var f = figOf(id); return f && str(f.source) === src; });
          var td = el("td");
          if (!ids.length) {
            td.appendChild(el("span", "dot is-none"));
          } else {
            var kinds = ids.map(function (id) { return kindOf(FIG[id]); });
            var kind = ["unknown", "estimate", "assumed", "measured"].filter(function (k) { return kinds.indexOf(k) >= 0; })[0];
            var dot = el("span", "dot is-" + kind);
            dot.setAttribute("title", ids.join(", "));
            td.appendChild(dot);
            td.appendChild(el("span", "sr-only", ids.join(", ") + ": " + t(KINDS.filter(function (k) { return k[0] === kind; })[0][1])));
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      body.appendChild(wrap);
      var legend = el("div", "trace-legend");
      KINDS.forEach(function (k) {
        if (!count[k[0]]) return;
        var item = el("span");
        item.appendChild(el("span", "dot is-" + k[0]));
        item.appendChild(document.createTextNode(t(k[1]) + (k[0] === "estimate" && estimatePending ? ", " + t("notTechReviewed").toLowerCase() : "")));
        legend.appendChild(item);
      });
      legend.appendChild(el("span", null, t("traceNote")));
      body.appendChild(legend);
    }


    shell.sec.appendChild(body);
    shell.sec.appendChild(shell.foot);
    deck.appendChild(shell.frame);
  })();

  // One "not tech-reviewed" badge per slide, in the kicker row, instead of one beside every estimate.
  Array.prototype.forEach.call(deck.querySelectorAll(".frame"), function (frame) {
    if (!/^slide-(\d+|appendix)$/.test(frame.id)) return;
    var found = frame.querySelectorAll(".slide-head .badge-est, .slide-body .badge-est");
    if (!found.length) return;
    Array.prototype.forEach.call(found, function (b) { b.parentNode.removeChild(b); });
    var kicker = frame.querySelector(".kicker");
    if (kicker) kicker.appendChild(estimateBadge());
  });

  // Arrow keys and Page Up / Page Down move one slide.
  document.addEventListener("keydown", function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var dir = (e.key === "ArrowRight" || e.key === "PageDown") ? 1 : ((e.key === "ArrowLeft" || e.key === "PageUp") ? -1 : 0);
    if (!dir) return;
    var frames = Array.prototype.slice.call(deck.querySelectorAll(".frame"));
    var target = null;
    if (dir > 0) {
      for (var i = 0; i < frames.length; i++) if (frames[i].getBoundingClientRect().top > 20) { target = frames[i]; break; }
    } else {
      for (var j = frames.length - 1; j >= 0; j--) if (frames[j].getBoundingClientRect().top < -20) { target = frames[j]; break; }
    }
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ block: "start" });
  });
})();
</script>
</body>
</html>
